m_neck_cars:{"m": ["الرقبة", "Neck"], "a": ["اقعد أو اقف وضهرك مفرود وكتفك مرخي لتحت.", "ابدأ بالدقن على صدرك، ولف راسك بالراحة في دايرة كاملة: جنب، ورا، الجنب التاني.", "ارجع للبداية وغيّر الاتجاه. 3–5 لفات في كل اتجاه."], "e": ["Sit or stand tall with relaxed shoulders.", "Start chin to chest and slowly roll the head in a full circle: side, back, other side.", "Return to the start and reverse. 3–5 circles each way."], "ta": "ببطء جدًا، ولو حسيت بدوخة أو وجع وقّف.", "te": "Go very slowly; stop if you feel dizzy or pain."},
m_chin_tuck:{"m": ["عضلات الرقبة العميقة", "Deep neck flexors"], "a": ["اقعد مفرود وبص قدامك.", "اسحب دقنك لورا في خط مستقيم كأنك بتعمل دقن مزدوجة، من غير ما تبص لتحت.", "اثبت ثانيتين وارجع. 10 مرات."], "e": ["Sit tall and look straight ahead.", "Glide the chin straight back as if making a double chin, without looking down.", "Hold 2 seconds and release. 10 reps."], "ta": "ممتاز بعد القعدة الطويلة قدام الكمبيوتر.", "te": "Great after long hours at a computer."},
m_neck_rot:{"m": ["الرقبة", "Neck"], "a": ["اقعد مفرود وكتفك ثابت.", "لف راسك بالراحة لليمين لحد ما تبص فوق كتفك.", "ارجع للنص ولف للشمال. 8 مرات لكل جنب."], "e": ["Sit tall with still shoulders.", "Slowly turn the head right to look over your shoulder.", "Return to centre and turn left. 8 reps each side."], "ta": "الكتف ما يتحركش مع الراس.", "te": "Keep the shoulders from turning with the head."},
m_neck_tilt:{"m": ["جانب الرقبة، الترابيس العلوية", "Side of the neck, upper traps"], "a": ["اقعد مفرود ودراعك جنبك.", "ميّل ودنك ناحية كتفك اليمين من غير ما ترفع الكتف.", "ارجع للنص وميّل للشمال. 8 مرات لكل جنب."], "e": ["Sit tall, arms by your sides.", "Tilt your ear toward your right shoulder without lifting the shoulder.", "Return to centre and tilt left. 8 reps each side."], "ta": "شد الكتف التاني لتحت علشان تحس بالإطالة أكتر.", "te": "Reach the opposite shoulder down to feel it more."},
m_shoulder_cars:{"m": ["مفصل الكتف", "Shoulder joint"], "a": ["اقف مفرود وشد بطنك، ودراع واحد مفرود جنبك.", "ارفع الدراع لقدام وفوق الراس، وكمّل الدايرة لورا وتحت ببطء وتحكم.", "5 لفات لكل اتجاه لكل دراع."], "e": ["Stand tall with a braced core, one arm straight at your side.", "Raise the arm forward and overhead, then continue the circle back and down slowly and with control.", "5 circles each direction per arm."], "ta": "جسمك ما يلفش مع الدراع؛ الحركة من الكتف بس.", "te": "Keep the torso still; the movement is only at the shoulder."},
m_arm_circles:{"m": ["الأكتاف", "Shoulders"], "a": ["اقف وافرد دراعك للجنبين على مستوى الكتف.", "اعمل دواير صغيرة لقدام، وكبّرها شوية بشوية.", "غيّر الاتجاه لورا. 10 لكل اتجاه."], "e": ["Stand with arms straight out to the sides at shoulder height.", "Make small forward circles, gradually making them bigger.", "Reverse backward. 10 each way."], "ta": "إحماء سريع قبل أي تمرين صدر أو كتف.", "te": "A quick warm-up before any chest or shoulder session."},
m_wall_slide:{"m": ["لوح الكتف، الضهر العلوي", "Shoulder blades, upper back"], "a": ["اسند ضهرك وراسك على الحيطة، والكوع والرسغ لازقين في الحيطة على شكل W.", "زحلق دراعك لفوق على الحيطة لحد ما يتفرد تقريبًا.", "انزل تاني لشكل W. 10 مرات."], "e": ["Stand with back and head against a wall, elbows and wrists on the wall in a W.", "Slide the arms up the wall until nearly straight.", "Slide back down to the W. 10 reps."], "ta": "أسفل ضهرك يفضل لازق في الحيطة.", "te": "Keep your lower back flat against the wall."},
m_band_pullapart:{"m": ["الكتف الخلفي، أعلى الضهر", "Rear delts, upper back"], "a": ["امسك الأستك قدامك بالدراعين مفرودين على مستوى الكتف.", "افتح الأستك للجنبين لحد ما يلمس صدرك وأنت بتضم لوحي الكتف.", "ارجع بالراحة. 15 مرة."], "e": ["Hold a band in front at shoulder height with straight arms.", "Pull it apart to the sides until it touches your chest, squeezing the shoulder blades.", "Return slowly. 15 reps."], "ta": "ما ترفعش كتفك لودنك.", "te": "Don’t shrug your shoulders up."},
m_stick_passthrough:{"m": ["الكتف، الصدر", "Shoulders, chest"], "a": ["امسك عصاية (أو عصاية مقشة) بمسكة واسعة قدام وسطك.", "ارفعها فوق راسك وكمّل لحد ما تنزل ورا ضهرك والدراع مفرود.", "ارجعها لقدام. 10 مرات، وضيّق المسكة مع الوقت."], "e": ["Hold a stick (or broom handle) with a wide grip in front of your hips.", "Lift it overhead and keep going until it is behind your back, arms straight.", "Bring it back to the front. 10 reps; narrow the grip over time."], "ta": "لو الكوع بيتني، وسّع المسكة.", "te": "If your elbows bend, widen your grip."},
m_scap_pushup:{"m": ["عضلة السيراتس، لوح الكتف", "Serratus anterior, shoulder blades"], "a": ["خد وضع البلانك على إيدك والدراع مفرود.", "من غير ما تتني الكوع، نزّل صدرك شوية لحد ما لوحي الكتف يقربوا من بعض.", "ادفع الأرض بعيد لحد ما لوح الكتف يتفتح. 12 مرة."], "e": ["Get into a high plank with straight arms.", "Without bending the elbows, let the chest sink so the shoulder blades come together.", "Push the floor away to spread them apart. 12 reps."], "ta": "الحركة صغيرة ومن الكتف بس.", "te": "The movement is small and only at the shoulder blades."},
m_scap_pullup:{"m": ["اللاتس السفلي، لوح الكتف", "Lower traps, lats"], "a": ["اتعلّق في العقلة والدراع مفرود.", "من غير ما تتني الكوع، شد لوحي الكتف لتحت فجسمك يطلع شوية.", "ارجع للتعليق. 10 مرات."], "e": ["Hang from a bar with straight arms.", "Without bending the elbows, pull the shoulder blades down so your body rises slightly.", "Return to the hang. 10 reps."], "ta": "تحضير ممتاز للعقلة.", "te": "Great preparation for pull-ups."},
m_ytw:{"m": ["الكتف الخلفي، أعلى الضهر", "Rear delts, upper back"], "a": ["انام على بطنك وجبهتك على الأرض.", "ارفع دراعك على شكل Y واثبت ثانيتين، وبعدين T، وبعدين W.", "دي عدّة واحدة. 8 مرات."], "e": ["Lie face down, forehead on the floor.", "Lift the arms into a Y and hold 2 s, then a T, then a W.", "That is one rep. 8 reps."], "ta": "الإبهام لفوق في الـY والـT.", "te": "Thumbs point up in the Y and T."},
m_band_ext_rot:{"m": ["الروتيتر كاف", "Rotator cuff"], "a": ["اربط الأستك على مستوى الكوع، واقف بجنبك، والكوع ملزوق في جنبك ومثني 90 درجة.", "لف الساعد لبره بعيد عن جسمك والكوع ثابت.", "ارجع بالراحة. 12 مرة لكل جنب."], "e": ["Anchor a band at elbow height, stand side-on, elbow tucked at 90 degrees.", "Rotate the forearm outward away from your body, elbow fixed.", "Return slowly. 12 reps each side."], "ta": "حط فوطة بين الكوع وجنبك علشان يفضل ثابت.", "te": "Put a towel between elbow and ribs to keep it in place."},
m_prone_swimmer:{"m": ["الكتف، أعلى الضهر", "Shoulders, upper back"], "a": ["انام على بطنك ودراعك مفرود قدامك ومرفوع شوية.", "لف دراعك للجنبين ولحد ورا ضهرك وإيدك قريبة من الأرض.", "ارجع لقدام. 10 مرات."], "e": ["Lie face down with arms overhead, hovering off the floor.", "Sweep the arms out to the sides and down behind your back, hands low.", "Sweep back overhead. 10 reps."], "ta": "خلّي الدراع مرفوع عن الأرض طول الحركة.", "te": "Keep the arms off the floor the whole time."},
m_floor_slide:{"m": ["لوح الكتف، الضهر العلوي", "Shoulder blades, upper back"], "a": ["انام على ضهرك والركبة مثنية، ودراعك على الأرض على شكل W.", "زحلق دراعك لفوق على الأرض لحد ما يتفرد.", "ارجع للـW. 10 مرات."], "e": ["Lie on your back, knees bent, arms on the floor in a W.", "Slide the arms overhead along the floor until straight.", "Slide back to the W. 10 reps."], "ta": "أسهل من زحلقة الحيطة، ابدأ بيها.", "te": "Easier than wall slides — start here."},
m_reach_roll_lift:{"m": ["الكتف، أعلى الضهر", "Shoulders, upper back"], "a": ["اقعد على كعبك وانحني لقدام والساعدين على الأرض (وضع الطفل).", "مد دراع لقدام، لف الكف لفوق، وارفعه من الأرض.", "نزّله وارجع. 8 مرات لكل دراع."], "e": ["Sit back on your heels with forearms on the floor (child’s pose).", "Reach one arm forward, turn the palm up and lift it off the floor.", "Lower and return. 8 reps each arm."], "ta": "خلّي مقعدتك على كعبك علشان الحركة تبقى من الكتف.", "te": "Keep your hips on your heels so the shoulder does the work."},
m_thread_needle:{"m": ["الضهر العلوي، الكتف", "Upper back, shoulders"], "a": ["انزل على إيدك وركبك (على أربعة).", "عدّي دراع من تحت جسمك للجنب التاني لحد ما كتفك يلمس الأرض.", "ارجع وافتح نفس الدراع لفوق للسقف. 8 مرات لكل جنب."], "e": ["Get on hands and knees.", "Thread one arm under your body to the other side until the shoulder touches the floor.", "Come back and open the same arm up to the ceiling. 8 reps each side."], "ta": "بص على إيدك وهي طالعة.", "te": "Follow your hand with your eyes."},
m_open_book:{"m": ["الضهر العلوي، الصدر", "Upper back, chest"], "a": ["انام على جنبك والركب مثنية 90 درجة، والدراعين مفرودين قدامك فوق بعض.", "افتح الدراع اللي فوق في قوس للجنب التاني والركب ثابتة.", "ارجع واقفل الكتاب. 8 مرات لكل جنب."], "e": ["Lie on your side, knees bent 90 degrees, arms straight in front, one on top of the other.", "Open the top arm in an arc to the other side, knees staying together.", "Return to close the book. 8 reps each side."], "ta": "خلّي ركبك لازقة في الأرض.", "te": "Keep your knees stacked on the floor."},
m_quad_tspine:{"m": ["الضهر العلوي", "Upper back"], "a": ["انزل على أربعة وحط إيد ورا راسك.", "لف الكوع لتحت ناحية الإيد التانية.", "لفه لفوق للسقف على قد ما تقدر. 8 مرات لكل جنب."], "e": ["On hands and knees, place one hand behind your head.", "Rotate the elbow down toward the other hand.", "Rotate it up toward the ceiling as far as you can. 8 reps each side."], "ta": "الحوض ثابت، اللف من الضهر بس.", "te": "Keep the hips still; rotate from the upper back."},
m_foam_tspine:{"m": ["الضهر العلوي", "Upper back"], "a": ["انام على ضهرك والفوم رولر تحت أعلى ضهرك، وإيدك ورا راسك.", "ميّل لورا فوق الرولر وصدرك لفوق.", "ارجع وحرّك الرولر خطوة. 10 مرات."], "e": ["Lie back with a foam roller under your upper back, hands behind your head.", "Extend back over the roller, chest up.", "Return, then move the roller a little. 10 reps."], "ta": "ما تنزلش الرولر لأسفل الضهر.", "te": "Don’t roll down onto your lower back."},
m_seated_tspine:{"m": ["الضهر العلوي", "Upper back"], "a": ["اقعد على كرسي أو على الأرض ورجلك متربعة، ودراعك متقاطع على صدرك.", "لف جسمك لليمين على قد ما تقدر والحوض ثابت.", "ارجع ولف للشمال. 8 مرات لكل جنب."], "e": ["Sit on a chair or cross-legged, arms crossed over your chest.", "Rotate your torso right as far as possible, hips still.", "Return and rotate left. 8 reps each side."], "ta": "اطلع لفوق وانت بتلف علشان ضهرك يفضل مفرود.", "te": "Sit tall as you turn to keep the spine long."},
m_wall_angel:{"m": ["الضهر العلوي، الكتف", "Upper back, shoulders"], "a": ["اسند ضهرك وراسك على الحيطة والكعب بعيد عنها شوية.", "ارفع دراعك وارسم بيه دايرة كبيرة على الحيطة زي جناح الملاك.", "ارجع لتحت. 10 مرات."], "e": ["Stand with back and head on a wall, heels a little away.", "Raise the arms and sweep them in a big arc along the wall like angel wings.", "Lower them back. 10 reps."], "ta": "لو الدراع بيبعد عن الحيطة، صغّر الحركة.", "te": "If the arms come off the wall, shorten the range."},
m_bench_tspine:{"m": ["الضهر العلوي، اللاتس", "Upper back, lats"], "a": ["اركع قدام بنش وحط الكوعين عليه، وامسك عصاية أو إيدك ورا راسك.", "نزّل صدرك لتحت بين الدراعين ومقعدتك لورا.", "اثبت 3 ثواني وارجع. 10 مرات."], "e": ["Kneel in front of a bench with elbows on it, hands together or holding a stick.", "Sink your chest down between your arms, hips back.", "Hold 3 s and come up. 10 reps."], "ta": "ممتاز قبل تمارين فوق الراس.", "te": "Great before overhead work."},
m_side_windmill:{"m": ["الضهر العلوي، الصدر، الكتف", "Upper back, chest, shoulders"], "a": ["انام على جنبك والركبة اللي فوق مثنية على الأرض قدامك.", "ارسم بالدراع اللي فوق دايرة كبيرة فوق راسك ولورا ولتحت.", "عيّن عينك على إيدك. 6 لفات لكل جنب."], "e": ["Lie on your side with the top knee bent on the floor in front.", "Draw a big circle with the top arm overhead, behind and down.", "Watch your hand. 6 circles each side."], "ta": "الركبة اللي فوق تفضل على الأرض.", "te": "Keep the top knee pinned to the floor."},
m_bretzel:{"m": ["الضهر العلوي، مثنية الفخذ، الفخذ الأمامي", "Upper back, hip flexors, quads"], "a": ["انام على جنبك واطلع الركبة اللي فوق لقدام على الأرض وامسكها بالإيد اللي تحت.", "بالإيد اللي فوق امسك قدم الرجل اللي تحت وارجعها لورا.", "لف كتفك لورا ناحية الأرض واتنفّس. 30–45 ثانية لكل جنب."], "e": ["Lie on your side, pull the top knee forward to the floor and hold it with the bottom hand.", "With the top hand grab the bottom foot behind you.", "Rotate your shoulders back toward the floor and breathe. 30–45 s each side."], "ta": "مع كل نفس طالع لف شوية زيادة.", "te": "Rotate a little further with each exhale."},
m_pelvic_tilt:{"m": ["أسفل الضهر، البطن", "Lower back, abs"], "a": ["انام على ضهرك والركبة مثنية والقدم على الأرض.", "لزّق أسفل ضهرك في الأرض بإنك تميل الحوض لفوق.", "ميّله للناحية التانية لحد ما يبقى فيه فراغ صغير. 12 مرة."], "e": ["Lie on your back, knees bent, feet flat.", "Press your lower back into the floor by tilting the pelvis up.", "Tilt the other way to make a small arch. 12 reps."], "ta": "حركة صغيرة ومريحة لأسفل الضهر.", "te": "A small, soothing movement for the lower back."},
m_segmental_catcow:{"m": ["العمود الفقري", "Whole spine"], "a": ["انزل على أربعة.", "قوّس ضهرك لفوق ببطء فقرة ورا فقرة، من الحوض للراس.", "انزل للناحية التانية فقرة فقرة. 6 مرات."], "e": ["Get on hands and knees.", "Round your back up slowly, one vertebra at a time from tailbone to head.", "Arch the other way segment by segment. 6 reps."], "ta": "كل ما تبطّأ أكتر، كل ما يبقى أحسن.", "te": "The slower, the better."},
m_jefferson:{"m": ["العمود الفقري، الخلفية", "Spine, hamstrings"], "a": ["اقف ورجلك مفرودة.", "لف ضهرك لتحت ببطء فقرة ورا فقرة: الدقن، الكتف، نص الضهر، أسفل الضهر.", "اطلع بنفس الطريقة بالعكس. 5 مرات بطيئة."], "e": ["Stand with straight legs.", "Slowly roll down one vertebra at a time: chin, shoulders, mid-back, lower back.", "Roll back up in reverse. 5 slow reps."], "ta": "من غير وزن في الأول، وما تكملش لو حسيت بوجع.", "te": "Start without weight and stop if anything hurts."},

// Original animated exercise figures: a side-view rig driven by joint angles.
// Angles are degrees from straight up; positive turns toward the figure's front (+x).
const FIG_L = { shin:60, thigh:62, torso:70, neck:8, head:14, upper:40, fore:38 };
const FIGURES = {
  squat: {
    hl:['quads','glutes'], prop:'barbell',
    from:{ shin:0,  thigh:0,   torso:3,  arm:35, elbow:152 },
    to:  { shin:32, thigh:-80, torso:42, arm:35, elbow:152 },
    down:1.3, hold:0.35, up:1.0, rest:0.7,
  },
};
function figDir(a) { const r = a * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; }
function figAdd(p, a, len) { const d = figDir(a); return [p[0] + d[0] * len, p[1] + d[1] * len]; }
function figIK(S, H, l1, l2, pref) {
  const dx = H[0] - S[0], dy = H[1] - S[1];
  let d = Math.hypot(dx, dy); d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
  const ux = dx / (Math.hypot(dx, dy) || 1), uy = dy / (Math.hypot(dx, dy) || 1);
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const bx = S[0] + ux * a, by = S[1] + uy * a;
  const c1 = [bx - uy * h, by + ux * h], c2 = [bx + uy * h, by - ux * h];
  const score = c => (c[0] - S[0]) * pref[0] + (c[1] - S[1]) * pref[1];
  return score(c1) >= score(c2) ? c1 : c2;
}
function figPose(def, t) {
  const L = FIG_L, A = {};

  const ankle = [150, 262];

  const hip = figAdd(knee, A.thigh, L.thigh);

  const head = figAdd(shoulder, A.torso, L.neck + L.head);
  let hand, elbow, bar = null;
  if (def.prop === 'barbell') {
    // bar rests on the upper back; hands hold it, elbows solved to point down and back
    bar = figAdd(figAdd(shoulder, A.torso - 90, 11), A.torso, -4);
    hand = bar;

    const ua = A.torso + 180 + A.arm;
    elbow = figAdd(shoulder, ua, L.upper);

let toastT = 0;

function choose(msg, okLabel, noLabel, danger) {
  return new Promise(res => {

    layer.className = 'scrim center';
    layer.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true"><p></p><div class="acts"><button class="btn" data-a="no">${esc(noLabel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-a="ok">${esc(okLabel)}</button></div></div>`;
    layer.querySelector('p').textContent = msg;
    const done = v => { layer.remove(); res(v); };
    layer.addEventListener('click', e => { e.stopPropagation(); const a = e.target.closest('[data-a]'); if (a) done(a.dataset.a); else if (e.target === layer) done(null); });
    document.body.appendChild(layer);

}

const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function lineChart(pts, unit) {
  const W = 320, H = 140, pl = 34, pr = 12, pt = 12, pb = 24;
  const xs = pts.map(p => p.at), ys = pts.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const dMin = Math.min(...ys), dMax = Math.max(...ys);
  const pad = (dMax - dMin) * 0.2 || 1, y0 = dMin - pad, y1 = dMax + pad;
  const X = a => pl + (a - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const line = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p.at).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${X(pts[pts.length - 1].at).toFixed(1)},${H - pb}L${X(pts[0].at).toFixed(1)},${H - pb}Z`;
  const ticks = dMin === dMax ? [dMin] : [dMin, dMax];
  const last = pts[pts.length - 1];
  const df = a => fmtDate(a, { day:'numeric', month:'short' });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}" dir="ltr">
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmtW(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)" opacity=".7"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.at).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${p === last ? 4.5 : 2.5}" fill="${p === last ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H - 6}" text-anchor="start">${esc(df(pts[0].at))}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(df(last.at))}</text>
  </svg>`;
}
function delta(a, b, unit) {

}

}

    const plan = clone(r.sets);
    s.items.push({ exId:r.exId, note:'', plan, sets:prefillSets(r.exId, plan) });

}

const cur = () => S.sessions.get(S.editId);

async function finishSession() {

  const fillOf = (it, j) => {
    const x = it.sets[j]; if (x.r != null) return { w:x.w, r:x.r };
    const last = lastFor(it.exId, s.id);
    const ph = it.plan[j] && (it.plan[j].r != null || it.plan[j].w != null) ? it.plan[j] : last ? (last.sets[j] || last.sets[last.sets.length - 1]) : null;

  if (pending) { const ans = await choose(t('pendingQ', pending), t('logThem'), t('dropThem'), false); if (ans === null) return; logAll = ans === 'ok'; }

    const shape = s.items.map(it => ({ exId:it.exId, sets:it.sets }));
    if (sig(r.items) !== sig(shape) && shape.length) {

          const old = r.items.find(o => o.exId === it.exId);
          const base = old ? old.sets : it.sets.map(x => ({ w:x.w ?? null, r:x.r ?? null, ...keepT(x) }));

  S.editId = null; wake(false);

}

function completeSet(s, i, j) {
  const it = s.items[i], x = it.sets[j];
  x.done = true; delete x.pr;
  const pr = checkPR(s, it.exId, x);
  if (pr) { x.pr = pr.k; toast(t({ w:'prW', e:'prE', r:'prR', t:'prT' }[pr.k], pr.v)); }

}

/* timer */
let audioCtx = null;

async function doExport() {

  const name = `rep-log-${new Date().toISOString().slice(0, 10)}.json`;

    if (drag.from < to && k > drag.from && k <= to) sh = -drag.step;
    if (drag.from > to && k < drag.from && k >= to) sh = drag.step;
    x.style.transform = sh ? `translateY(${sh}px)` : '';
  });
});
const endDrag = () => {
  if (!drag.on) return; drag.on = false;
  const arr = S.view === 'session' ? cur()?.items : S.routineDraft?.items;
  if (arr && drag.to !== drag.from) { const [m] = arr.splice(drag.from, 1); arr.splice(drag.to, 0, m); if (S.view === 'session') saveSession(cur()); }
  render();
};
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, endDrag));
document.addEventListener('contextmenu', e => { if (e.target.closest('.ex, .ro-item')) e.preventDefault(); });
document.addEventListener('contextmenu', e => { if (e.target.closest('.row[data-act="openSession"]')) e.preventDefault(); });
window.addEventListener('scroll', () => { const tb = document.querySelector('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive:true });
function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
function autoGrowAll() { document.querySelectorAll('.note-area, .ex-note').forEach(el => { if (el.value) autoGrow(el); }); }

applyLang();
render();
initStore();
// Updates: check for a new service worker on every open; when it takes over, reload (but never mid-session).
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloading = false;
  const reloadNow = () => { if (reloading) return; reloading = true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    if (S.view === 'session') { toast(t('updating')); const iv = setInterval(() => { if (S.view !== 'session') { clearInterval(iv); setTimeout(reloadNow, 800); } }, 1000); }
    else { toast(t('updating')); setTimeout(reloadNow, 800); }
  });
}
})();
</script>
