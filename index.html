<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>سجل التمرين</title>
<meta name="description" content="سجّل تمارينك ومجموعاتك وأرقامك القياسية وقياسات جسمك.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F7FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سجل التمرين">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column, sticky top bar, fixed bottom tabs. Deliberately light-only: neutrals plus a single sky accent; red only for delete. */
:root{
  color-scheme:light;
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#EEF1F7; --ink:#1F2433; --muted:#6B7385; --line:#E3E7EF;
  --accent:#0284C7; --accent-ink:#FFFFFF; --accent-soft:#E0F2FE;
  --done:#0284C7; --done-ink:#FFFFFF; --done-soft:#C9E8FB;
  --danger:#E0483A; --danger-soft:#FFE7E3;
  --sun:#0284C7; --on-sun:#FFFFFF;
  --sky-1:#CFEFFF; --sky-2:#8FD8FB; --sky-ink:#073B57;
  --shadow:0 1px 2px rgb(31 36 51 / .06), 0 6px 18px rgb(31 36 51 / .06);
  --f-body:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-disp:"Baloo Bhaijaan 2", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes backIn{from{transform:translateX(-28%);opacity:.5}to{transform:none;opacity:1}}
.view.swiping{box-shadow:-10px 0 28px rgb(31 36 51 / .14);background:var(--bg);position:relative;z-index:5}
.view.back-in{animation:backIn .34s cubic-bezier(.32,.72,0,1)}
body.edge-drag{overflow:hidden;user-select:none;-webkit-user-select:none}
.view.swiping{position:relative;z-index:1;box-shadow:0 0 0 300vmax var(--bg)}
#underlay{position:fixed;inset:0;z-index:0;background:var(--bg);overflow:hidden;pointer-events:none;will-change:transform}
#underlay .ul-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#underlay .ul-dim{position:absolute;inset:0;background:#000;opacity:.12;z-index:9}
.sheet{touch-action:pan-y}
html,body{overscroll-behavior-x:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{50%{transform:translate(-6px,8px) rotate(8deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes ring{25%{transform:translateY(-3px)}75%{transform:translateY(3px)}}
.view.anim > *{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.anim > *:nth-child(2){animation-delay:.04s}.view.anim > *:nth-child(3){animation-delay:.08s}
.view.anim > *:nth-child(4){animation-delay:.12s}.view.anim > *:nth-child(5){animation-delay:.16s}.view.anim > *:nth-child(n+6){animation-delay:.2s}
.new{animation:rise .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1.2;flex:1;min-width:0}
.topbar .t-main{flex:1;min-width:0}
.topbar .t-title{font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t-sub{color:var(--muted);font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none;transition:background .15s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
[dir="rtl"] .flip{transform:scaleX(-1)}

.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:99px;box-shadow:var(--shadow)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--done)} .sync.local i{background:var(--sun)} .sync.saving i{background:var(--accent);animation:pulse 1s infinite}

.btn{height:46px;padding-inline:18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);white-space:nowrap;transition:transform .12s, background .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgb(2 132 199 / .25)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:38px;padding-inline:12px;font-size:14px;border-radius:11px}
.link{color:var(--accent);font-weight:600;font-size:14px}

.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.empty{padding:22px 18px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:14px;background:color-mix(in srgb,var(--surface) 60%,transparent)}

/* home */
.hero{background:linear-gradient(135deg,var(--sky-1),var(--sky-2));color:var(--sky-ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgb(56 189 248 / .3)}
.hero .deco{position:absolute;inset-inline-end:-30px;top:-34px;width:150px;height:150px;border-radius:50%;border:20px solid rgb(255 255 255 / .28);animation:float 7s ease-in-out infinite;pointer-events:none}
.hero .deco::after{content:"";position:absolute;inset:22px;border-radius:50%;border:10px solid rgb(255 255 255 / .22)}
.hero .h-date{font-size:14px;font-weight:600;opacity:.75;position:relative}
.hero .h-title{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1.15;position:relative;text-wrap:balance}
.hero .h-sub{font-size:14px;position:relative}
.hero .btn{background:#FFFFFF;color:var(--accent);align-self:flex-start;position:relative;box-shadow:0 6px 14px rgb(7 59 87 / .14)}
.hero .live{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;position:relative}
.hero .live i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:start;width:100%;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .date{width:48px;height:52px;flex:none;text-align:center;line-height:1;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;flex-direction:column;justify-content:center;gap:3px}
.row .date b{font-family:var(--f-disp);font-size:22px;font-weight:800}
.row .date small{font-size:11px;font-weight:600}
.row .main{flex:1;min-width:0}
.row .r-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);flex:none}

/* tags */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

/* exercise cards (session + routine) */
.note-area{width:100%;min-height:46px;resize:vertical;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;line-height:1.5}
.note-area:focus,.ex-note:focus{outline:none;border-color:var(--accent)}
.ex{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ex-head{display:flex;align-items:flex-start;gap:6px}
.ex-head .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ex-head h3{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:700;line-height:1.25}
.ex-head .tools{display:flex;gap:2px}
.ex-head .tools .iconbtn{width:34px;height:34px;color:var(--muted)}
.ex-head .tools .iconbtn svg{width:18px;height:18px}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.mini{height:30px;padding-inline:10px;border-radius:99px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:transform .12s}
.mini:active{transform:scale(.95)}
.mini svg{width:14px;height:14px;flex:none}
.mini.acc{color:var(--accent);background:var(--accent-soft)}
.last{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;background:var(--surface-2);border-radius:10px;padding:6px 10px}
.last .num{font-size:16px;font-weight:700;color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.set.bw{grid-template-columns:30px 1fr 48px}
.set.nx{grid-template-columns:30px 1fr 1fr}.set.nx.bw{grid-template-columns:30px 1fr}
.set-wrap{position:relative;overflow:hidden;margin:-4px;padding:4px}
.set-wrap>.set{position:relative;z-index:1;transition:transform .22s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
.set-wrap.dragging>.set{transition:none}
.set-del{position:absolute;right:4px;top:50%;width:52px;height:48px;margin-top:-24px;border-radius:13px;background:var(--danger);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s;pointer-events:none}
.set-del svg{width:20px;height:20px}
.set-wrap.open .set-del{opacity:1;transform:none;pointer-events:auto}
.set-wrap.open>.set{transform:translateX(-64px)}
.set.head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.set .no{font-family:var(--f-disp);font-weight:700;font-size:18px;text-align:center;color:var(--muted);transition:color .2s,background .2s;height:38px;border-radius:10px;display:grid;place-items:center}
button.no:hover{background:var(--surface-2)}
.set .no.ty-w{background:var(--surface-2);color:var(--muted);font-size:15px}
.set .no.ty-f,.set .no.ty-d{background:var(--accent-soft);color:var(--accent);font-size:15px}
.set.timed{grid-template-columns:30px 1fr 48px 48px}
.sw{width:48px;height:48px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:background .2s}
.sw svg{width:18px;height:18px}
.sw.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s infinite}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.set input{width:100%;min-width:0;height:48px;border-radius:13px;border:2px solid transparent;background:var(--surface-2);text-align:center;font-family:var(--f-disp);font-weight:700;font-size:22px;padding:0 4px;transition:background .25s,border-color .15s}
.set input::placeholder{color:#AEB5C4;font-weight:600}
.set input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.check,.xbtn{width:48px;height:48px;border-radius:13px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s}
.check svg{width:22px;height:22px}
.xbtn svg{width:18px;height:18px}
.set.done input{background:var(--done-soft);color:#0B3954}
.ex.all-done{background:#EAF5FD}
.set.done .check{background:var(--done);color:var(--done-ink);animation:pop .35s ease}
.set.done .no{color:var(--done)}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap}
.ex-actions .btn{flex:1}
.ex-note{width:100%;min-height:42px;resize:vertical;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:8px 10px;font-size:14px}
.add-ex{height:56px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 50%,transparent);border-radius:18px;font-weight:700;width:100%;transition:transform .12s}
.add-ex:active{transform:scale(.98)}
.danger-link{color:var(--danger);font-weight:600;font-size:14px;padding:10px;align-self:center}

.timer{position:fixed;inset:auto 0 0 0;z-index:8;background:var(--sun);color:var(--on-sun);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgb(2 132 199 / .3);animation:slideUp .3s cubic-bezier(.2,.8,.2,1)}
.timer-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px}
.timer .t-time{font-family:var(--f-disp);font-size:34px;font-weight:800;min-width:80px;line-height:1}
.timer .t-lbl{font-size:12px;font-weight:700;opacity:.8}
.timer .grow{flex:1;min-width:0}
.timer .bar{height:6px;border-radius:3px;background:rgb(255 255 255 / .3);overflow:hidden;margin-top:6px}
.timer .bar i{display:block;height:100%;background:var(--on-sun);width:0;border-radius:3px;transition:width .25s linear}
.timer button{height:40px;min-width:46px;padding-inline:10px;border-radius:12px;background:rgb(255 255 255 / .2);font-weight:800;font-family:var(--f-disp);font-size:17px;display:grid;place-items:center}
.timer.ring{animation:ring .25s 6}
.timer .t-ago{font-size:.62em;font-weight:700;opacity:.85;white-space:nowrap}
.timer .t-done{font-family:var(--f-disp);font-size:20px;font-weight:800}
.timer button.t-more{display:flex;gap:6px;align-items:center;font-size:15px;padding-inline:14px;background:var(--on-sun);color:var(--sun)}
.rest-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rest-pick button{height:52px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-disp);font-weight:800;font-size:17px}
.rest-pick button:active{transform:scale(.96)}
.ritem .tpl-i{color:var(--muted);flex:none;display:inline-flex}
button.ritem{width:100%;text-align:start}
.timer button.t-time{background:none;height:auto;min-width:80px;padding:0;font-size:34px}
.nav .timer{position:static;border-radius:16px;margin:8px 0 2px;padding:0 12px;box-shadow:0 4px 14px rgb(2 132 199 / .25)}
.nav .timer .timer-in{padding-block:8px}
.nav .timer button{flex-direction:row;padding-block:0;font-size:17px;color:inherit;gap:6px;overflow:visible;font-weight:800}
.nav .timer button.t-go{display:block;text-align:start;height:auto;min-width:0;padding:4px 0;background:none;border-radius:0}
.nav .timer .t-goto{display:block;font-size:12px;font-weight:700;opacity:.85;font-family:var(--f-body)}
.nav .timer button.t-go .t-lbl{font-family:var(--f-body);font-size:12px}
.nav .timer button.t-more{color:var(--sun);font-size:15px}
.nav .live-pill{flex-direction:row;padding-block:11px;font-size:14px;color:var(--accent);font-weight:800;gap:10px}
.nav .live-pill #liveEl{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.nav .timer button.t-time{font-size:26px;min-width:64px}
.live-pill{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 2px;padding:11px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px}
.live-pill i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;flex:none}
.live-pill .grow{flex:1;min-width:0;text-align:start;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.has-live #app{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.rs-val{font-family:var(--f-disp);font-size:48px;font-weight:800;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.rs-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:-6px}
.rs-step{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rs-step button{height:48px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-disp);font-weight:800;font-size:17px}
.rs-step button:active{transform:scale(.95)}
html,body{touch-action:manipulation}
@supports (-webkit-touch-callout:none){input,textarea,select{font-size:max(16px,1em)}}

/* routines */
.r-card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.r-card[data-lpr]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;transition:box-shadow .15s,transform .15s}
.r-card.sel-mode .r-open{padding-inline-end:40px}
.r-card.sel-mode .r-acts{opacity:.45;pointer-events:none}
.r-card.sel{box-shadow:0 0 0 2.5px var(--accent),var(--shadow)}
.r-check{position:absolute;top:14px;inset-inline-end:14px;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.r-check svg{width:16px;height:16px}
.r-card.sel .r-check{background:var(--accent);border-color:var(--accent);color:#fff}
.sel-bar{position:fixed;z-index:8;left:12px;right:12px;margin:0 auto;max-width:536px;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:10px;border-radius:18px;background:var(--surface);box-shadow:0 8px 28px rgb(0 0 0 / .18);animation:rise .2s ease both}
.sel-bar .sel-n{flex:1;text-align:center;font-weight:700;font-size:14px}
.sel-bar .btn{flex:none}
.r-card.dragging{z-index:6;box-shadow:0 0 0 2.5px var(--accent),0 18px 40px rgb(0 0 0 / .22);transition:none;scale:1.02}
.r-card.drag-ghost{opacity:.35}
.r-card.drop-before::before,.r-card.drop-after::after{content:'';position:absolute;left:8px;right:8px;height:4px;border-radius:4px;background:var(--accent)}
.r-card.drop-before::before{top:-12px}.r-card.drop-after::after{bottom:-12px}
body.r-dragging{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body.r-dragging .sel-bar{visibility:hidden}

cable_shrug:{m:["الترابيس العلوية", "Upper traps"],a:["ثبّت البار المستقيم على البكرة اللي تحت خالص واقف قريب منها.", "امسك البار بعرض الكتف ودراعك مفرود، وارفع كتفك لفوق ناحية ودنك على قد ما تقدر.", "اثبت ثانية فوق ونزّل ببطء لحد ما الكتف ينزل على الآخر."],e:["Attach a straight bar to the lowest pulley and stand close to it.", "Hold the bar shoulder-width with straight arms and shrug your shoulders straight up toward your ears.", "Pause a second at the top and lower slowly to a full stretch."],ta:"ما تلفّش كتفك، الحركة لفوق ولتحت بس. والكابل بيفضل شادد طول الحركة أحسن من الدمبل.",te:"Don’t roll the shoulders — straight up and down. The cable keeps tension the whole way."},

cal_wall_pushup:{m:["الصدر، التراي، الكتف", "Chest, triceps, shoulders"],a:["اقف قدام الحيطة بخطوة وحط إيدك عليها بعرض الكتف على مستوى صدرك.", "انزل بصدرك ناحية الحيطة والكوع رايح لورا بزاوية 45 درجة.", "ازق الحيطة وارجع لحد ما دراعك يتفرد."],e:["Stand a step from a wall, hands on it shoulder-width at chest height.", "Lower your chest toward the wall, elbows going back at about 45 degrees.", "Push away until your arms are straight."],ta:"أول خطوة في الضغط. كل ما تبعد رجلك عن الحيطة بيصعب.",te:"The very first push-up step. Stepping farther from the wall makes it harder."},
cal_knee_pushup:{m:["الصدر، التراي، الكتف", "Chest, triceps, shoulders"],a:["انزل على ركبك وحط إيدك على الأرض أوسع من كتفك سنة.", "خلي جسمك خط مستقيم من راسك لركبتك وشد بطنك.", "انزل بصدرك لقرب الأرض وازق لفوق."],e:["Kneel and place your hands slightly wider than your shoulders.", "Keep a straight line from head to knees and brace your abs.", "Lower your chest close to the floor and push back up."],ta:"ما تخليش وسطك يتني لورا. لما تعمل 3×15 انقل للضغط العادي.",te:"Don’t pike your hips. Once you hit 3×15, move to full push-ups."},
cal_wide_pushup:{m:["الصدر", "Chest"],a:["وضع الضغط والإيد أوسع من الكتف بشبر تقريبًا.", "انزل لحد ما صدرك يقرب من الأرض.", "ازق لفوق وجسمك خط مستقيم."],e:["Push-up position with hands about a hand-span wider than shoulders.", "Lower until your chest is near the floor.", "Push back up keeping a straight body."],ta:"بيركّز على الصدر أكتر من التراي.",te:"Shifts the work toward the chest."},
cal_diamond_pushup:{m:["التراي، الصدر الداخلي", "Triceps, inner chest"],a:["وضع الضغط واعمل شكل ماسة بالصوابع الكبيرة والسبابة تحت صدرك.", "انزل والكوع لازق في جنبك لحد ما صدرك يلمس إيدك.", "ازق لفوق."],e:["Push-up position, thumbs and index fingers touching in a diamond under your chest.", "Lower with elbows close to your sides until your chest touches your hands.", "Press back up."],ta:"لو صعب، اعمله على ركبك الأول.",te:"Too hard? Do it from your knees first."},
cal_decline_pushup:{m:["الصدر العلوي، الكتف", "Upper chest, shoulders"],a:["حط رجلك على كرسي أو بنش وإيدك على الأرض.", "جسمك خط مستقيم وبطنك مشدودة.", "انزل بصدرك للأرض وازق لفوق."],e:["Feet on a chair or bench, hands on the floor.", "Keep a straight body with braced abs.", "Lower your chest to the floor and push up."],ta:"كل ما الرجل تعلى بيبقى أصعب وبيشتغل الكتف أكتر.",te:"The higher the feet, the harder it gets and the more shoulders work."},
cal_explosive_pushup:{m:["الصدر، التراي (قوة انفجارية)", "Chest, triceps (power)"],a:["وضع الضغط العادي.", "انزل وبعدين ازق بأقصى سرعة لحد ما إيدك تسيب الأرض.", "صقّف بسرعة وانزل على إيدك والكوع مثني سنة."],e:["Regular push-up position.", "Lower, then push as hard as you can so your hands leave the floor.", "Clap quickly and land softly with bent elbows."],ta:"ابدأ من غير تصفيق: بس سيب الأرض بإيدك.",te:"Start without the clap — just get the hands off the floor."},
cal_archer_pushup:{m:["الصدر، التراي (دراع واحد أكتر)", "Chest, triceps (one arm biased)"],a:["وضع الضغط والإيد واسعة جدًا.", "انزل ناحية إيد واحدة والدراع التاني يتفرد على الجنب.", "ازق لفوق وبدّل الجنب."],e:["Push-up position with a very wide hand placement.", "Lower toward one hand while the other arm straightens out to the side.", "Push up and switch sides."],ta:"خطوة قبل الضغط بإيد واحدة.",te:"A stepping stone to the one-arm push-up."},
cal_pseudo_planche_pushup:{m:["الكتف الأمامي، الصدر، التراي", "Front delts, chest, triceps"],a:["وضع الضغط والإيد عند وسطك وصوابعك لبرا أو لورا.", "ميّل جسمك لقدام لحد ما كتفك يبقى قدام إيدك.", "انزل وارجع وانت محافظ على الميل لقدام."],e:["Push-up position with hands by your waist, fingers turned out or back.", "Lean forward until your shoulders are well in front of your hands.", "Lower and press while keeping the forward lean."],ta:"سخّن الرسغ كويس قبل التمرين ده.",te:"Warm up your wrists well first."},
cal_one_arm_pushup:{m:["الصدر، التراي، الكور", "Chest, triceps, core"],a:["رجلك مفتوحة واسع وإيد واحدة تحت صدرك والتانية ورا ضهرك.", "شد بطنك ووسطك علشان جسمك ما يلفش.", "انزل لحد ما صدرك يقرب من الأرض وازق لفوق."],e:["Feet wide, one hand under your chest, the other behind your back.", "Brace your core so your body doesn’t rotate.", "Lower until your chest nears the floor and press up."],ta:"ابدأ بيه على حاجة عالية (ترابيزة) ونزّل الارتفاع بالتدريج.",te:"Start with the hand on a table and lower the height over time."},
cal_pike_elevated:{m:["الكتف، التراي", "Shoulders, triceps"],a:["حط رجلك على كرسي أو بنش وارفع وسطك لفوق لحد ما جسمك يبقى زي حرف V مقلوب.", "انزل بقمة راسك ناحية الأرض قدام إيدك.", "ازق لفوق لحد ما دراعك يتفرد."],e:["Feet on a chair or bench, hips high so your body forms an upside-down V.", "Lower the top of your head toward the floor in front of your hands.", "Press back up to straight arms."],ta:"خطوة قبل ضغط الوقوف على الإيدين.",te:"The step before handstand push-ups."},
cal_wall_handstand:{m:["الكتف، الترابيس، الكور", "Shoulders, traps, core"],a:["ضهرك للحيطة وإيدك على الأرض قريب منها، واطلع برجلك على الحيطة لحد ما تبقى مقلوب.", "دراعك مفرود والكتف زاقق لفوق ناحية ودنك.", "شد بطنك وثبّت."],e:["Back to the wall, hands near it, walk your feet up until you’re upside down.", "Arms locked, shoulders pushed up toward your ears.", "Brace your abs and hold."],ta:"ابدأ بـ 10–20 ثانية. بطنك للحيطة أصعب وأحسن للشكل.",te:"Start with 10–20 s. Chest-to-wall is harder and builds better form."},
cal_hspu_wall:{m:["الكتف، التراي", "Shoulders, triceps"],a:["اطلع وقوف على إيدك على الحيطة.", "انزل ببطء لحد ما راسك تلمس الأرض (أو مخدة).", "ازق لفوق لحد ما دراعك يتفرد."],e:["Kick up into a wall handstand.", "Lower slowly until your head touches the floor (or a pad).", "Press back up to straight arms."],ta:"حط مخدة تحت راسك، وابدأ بالنزول البطيء بس.",te:"Put a pad under your head and start with slow negatives only."},
cal_freestanding_hs:{m:["الكتف، الكور، التوازن", "Shoulders, core, balance"],a:["اطلع برجلك لفوق ووازن جسمك من غير ما تسند.", "ظبط التوازن بصوابع إيدك.", "ثبّت أطول وقت ممكن وانزل بأمان."],e:["Kick up and balance with no support.", "Steer the balance with your fingertips.", "Hold as long as you can and come down safely."],ta:"اتعلم إزاي تنزل بأمان (تلف وتنزل على رجلك) قبل أي حاجة.",te:"Learn to bail safely (twist and step down) before anything else."},
cal_crow:{m:["الكتف، الرسغ، الكور", "Shoulders, wrists, core"],a:["اقعد مقرفص وحط إيدك على الأرض بعرض الكتف.", "حط ركبك على ضهر دراعك فوق الكوع.", "ميّل لقدام لحد ما رجلك ترتفع من الأرض وثبّت."],e:["Squat down and place your hands shoulder-width on the floor.", "Rest your knees on the backs of your upper arms.", "Lean forward until your feet lift and hold."],ta:"حط مخدة قدامك لو خايف تقع على وشك.",te:"Put a pillow in front of you in case you tip forward."},
cal_planche_lean:{m:["الكتف الأمامي، الرسغ", "Front delts, wrists"],a:["وضع الضغط وصوابعك لبرا.", "ميّل جسمك لقدام لحد ما كتفك يبقى قدام إيدك والدراع مفرود.", "ثبّت وضهرك مقوّس لفوق سنة."],e:["Push-up position, fingers turned out.", "Lean forward until your shoulders pass your hands, arms locked.", "Hold with the upper back slightly rounded."],ta:"كل ما تميّل أكتر بيصعب. أساس البلانش.",te:"The farther you lean, the harder. The base of the planche."},
cal_tuck_planche:{m:["الكتف، الكور، الرسغ", "Shoulders, core, wrists"],a:["امسك البارالتس أو الأرض والدراع مفرود.", "ميّل لقدام وارفع رجلك منكمشة تحت جسمك.", "ثبّت وجسمك كله في الهوا."],e:["Grip parallettes (or the floor) with locked arms.", "Lean forward and lift your tucked legs under your body.", "Hold with your whole body off the floor."],ta:"لازم تعمل ميل البلانش 30 ثانية الأول.",te:"Build a 30 s planche lean first."},
cal_support_hold:{m:["التراي، الكتف، الصدر", "Triceps, shoulders, chest"],a:["اطلع على المتوازي ودراعك مفرود.", "اضغط كتفك لتحت بعيد عن ودنك.", "ثبّت وجسمك مستقيم."],e:["Jump up on parallel bars with straight arms.", "Push your shoulders down away from your ears.", "Hold with a straight body."],ta:"أول خطوة للديبس.",te:"The first step toward dips."},
cal_neg_dip:{m:["الصدر، التراي، الكتف", "Chest, triceps, shoulders"],a:["اطلع على المتوازي ودراعك مفرود.", "انزل ببطء جدًا في 3–5 ثواني لحد ما الكوع يبقى 90 درجة.", "انزل على رجلك واطلع تاني."],e:["Get up on the bars with straight arms.", "Lower very slowly over 3–5 s until your elbows reach 90 degrees.", "Step down and jump back up."],ta:"لما تعمل 3×8 نزول بطيء جرّب ديبس كامل.",te:"Once you can do 3×8 negatives, try full dips."},
cal_straight_bar_dip:{m:["الصدر، التراي", "Chest, triceps"],a:["اطلع فوق بار مستقيم (على مستوى صدرك) والبار قدام وسطك.", "ميّل لقدام وانزل لحد ما البار يلمس صدرك.", "ازق لفوق لحد ما دراعك يتفرد."],e:["Get on top of a straight bar at chest height, bar in front of your hips.", "Lean forward and lower until the bar touches your chest.", "Press back up to straight arms."],ta:"مهم جدًا للماسل أب.",te:"Key for the muscle-up."},
cal_ring_dip:{m:["الصدر، التراي، الثبات", "Chest, triceps, stability"],a:["اطلع على الحلق ودراعك مفرود والحلق لازق في جنبك.", "انزل لحد ما الكوع يبقى أقل من 90 درجة والحلق ثابت.", "ازق لفوق ولف الحلق لبرا سنة في الآخر."],e:["Support on the rings with straight arms, rings by your sides.", "Lower below 90 degrees at the elbow while keeping the rings steady.", "Press up and turn the rings out at the top."],ta:"أصعب بكتير من المتوازي. ابدأ بثبات 30 ثانية على الحلق.",te:"Much harder than bar dips. Start with a 30 s ring support."},
cal_bw_tri_ext:{m:["التراي", "Triceps"],a:["امسك طرف بنش أو بار واطي وجسمك مستقيم زي الضغط المايل.", "اثني الكوع ونزّل راسك تحت مستوى إيدك.", "افرد دراعك وارجع."],e:["Grip the edge of a bench or low bar with your body straight like an incline push-up.", "Bend your elbows and lower your head below your hands.", "Straighten your arms to return."],ta:"كل ما رجلك تبعد بيصعب.",te:"The farther your feet, the harder."},
cal_active_hang:{m:["الضهر، القبضة، الكتف", "Back, grip, shoulders"],a:["اتعلّق في العقلة ودراعك مفرود.", "اسحب كتفك لتحت بعيد عن ودنك من غير ما تثني الكوع.", "ثبّت."],e:["Hang from the bar with straight arms.", "Pull your shoulders down away from your ears without bending your elbows.", "Hold."],ta:"أساس كل تمارين العقلة.",te:"The foundation of every pull-up."},
cal_flexed_hang:{m:["الضهر، الباي", "Back, biceps"],a:["اطلع (بنط أو على كرسي) لحد ما دقنك فوق البار.", "ثبّت فوق والكوع مثني والصدر قريب من البار.", "انزل ببطء لما تتعب."],e:["Jump or step up until your chin is over the bar.", "Hold the top with bent elbows and chest near the bar.", "Lower slowly when you tire."],ta:"بيبني قوة آخر العقلة.",te:"Builds strength at the top of the pull-up."},
cal_neg_pullup:{m:["الضهر، الباي", "Back, biceps"],a:["اطلع على كرسي لحد ما دقنك فوق البار.", "شيل رجلك وانزل ببطء جدًا في 3–5 ثواني.", "لحد ما دراعك يتفرد خالص وارجع اطلع."],e:["Use a chair to get your chin over the bar.", "Take your feet off and lower very slowly over 3–5 s.", "Until your arms are fully straight, then step back up."],ta:"أحسن طريقة توصل لأول عقلة.",te:"The best way to get your first pull-up."},
cal_band_pullup:{m:["الضهر، الباي", "Back, biceps"],a:["اربط أستك في البار وحط رجلك أو ركبتك فيه.", "اسحب نفسك لحد ما دقنك فوق البار.", "انزل بتحكم."],e:["Loop a band over the bar and put your foot or knee in it.", "Pull until your chin clears the bar.", "Lower under control."],ta:"قلّل قوة الأستك بالتدريج.",te:"Use thinner bands over time."},
cal_table_row:{m:["الضهر، الباي", "Back, biceps"],a:["نام تحت ترابيزة متينة وامسك طرفها.", "جسمك مستقيم والكعب على الأرض.", "اسحب صدرك لحد الترابيزة وانزل بتحكم."],e:["Lie under a sturdy table and grip its edge.", "Keep a straight body with heels on the floor.", "Pull your chest up to the table and lower under control."],ta:"اتأكد إن الترابيزة مش هتتقلب.",te:"Make sure the table can’t tip."},
cal_wide_pullup:{m:["اللاتس", "Lats"],a:["امسك البار أوسع من الكتف بكتير وكفك لقدام.", "اسحب لحد ما دقنك فوق البار والكوع رايح لتحت وجنب.", "انزل لحد ما دراعك يتفرد."],e:["Grip the bar much wider than your shoulders, palms forward.", "Pull until your chin clears the bar, elbows driving down and out.", "Lower to straight arms."],ta:"ما تمرجحش جسمك.",te:"Don’t swing."},
cal_c2b_pullup:{m:["الضهر، الباي", "Back, biceps"],a:["اتعلّق في البار بعرض الكتف.", "اسحب بقوة لحد ما صدرك يلمس البار.", "انزل بتحكم."],e:["Hang with a shoulder-width grip.", "Pull hard until your chest touches the bar.", "Lower under control."],ta:"بيجهزك للماسل أب.",te:"Prepares you for the muscle-up."},
cal_skin_cat:{m:["الكتف، الضهر، الكور", "Shoulders, back, core"],a:["اتعلّق في البار أو الحلق.", "ارفع رجلك وعدّيها بين دراعك ولف لورا لحد ما تنزل رجلك ناحية الأرض.", "ارجع بنفس الطريق ببطء."],e:["Hang from a bar or rings.", "Lift your legs through your arms and rotate back until your feet point to the floor.", "Return the same way slowly."],ta:"روح لحد ما كتفك يستحمل بس.",te:"Only go as far as your shoulders allow."},
cal_l_pullup:{m:["الضهر، البطن", "Back, abs"],a:["اتعلّق وارفع رجلك مفرودة قدامك على شكل حرف L.", "اسحب لحد ما دقنك فوق البار ورجلك ثابتة.", "انزل بتحكم."],e:["Hang and raise straight legs in front of you into an L.", "Pull until your chin clears the bar while holding the L.", "Lower under control."],ta:"لو صعب، اثني ركبتك (تك).",te:"Too hard? Tuck the knees."},
cal_archer_pullup:{m:["اللاتس (دراع واحد أكتر)", "Lats (one arm biased)"],a:["امسك البار واسع جدًا.", "اسحب ناحية إيد واحدة والدراع التاني يتفرد على البار.", "انزل وبدّل الجنب."],e:["Take a very wide grip.", "Pull toward one hand while the other arm straightens along the bar.", "Lower and switch sides."],ta:"خطوة قبل العقلة بإيد واحدة.",te:"A step toward the one-arm pull-up."},
cal_typewriter_pullup:{m:["اللاتس، الباي", "Lats, biceps"],a:["اطلع عقلة لحد ما دقنك فوق البار بقبضة واسعة.", "اتحرك فوق يمين لحد إيدك اليمين وبعدين شمال.", "انزل بتحكم."],e:["Pull up with a wide grip until your chin is over the bar.", "Shift across to your right hand, then to your left.", "Lower under control."],ta:"حافظ على صدرك قريب من البار وانت بتتحرك.",te:"Keep your chest close to the bar as you shift."},
cal_muscle_up:{m:["الضهر، الصدر، التراي", "Back, chest, triceps"],a:["اتعلّق بقبضة قريبة من الكتف وعمل مرجحة صغيرة.", "اسحب بقوة لحد وسطك ناحية البار وميّل لقدام فوقه.", "ازق لفوق لحد ما دراعك يتفرد فوق البار."],e:["Hang with a shoulder-width grip and a small swing.", "Pull explosively toward your hips and lean over the bar.", "Press up until your arms are locked above the bar."],ta:"قبلها لازم تعمل 10 عقلة صدر و10 ديبس على بار مستقيم.",te:"First build 10 chest-to-bar pull-ups and 10 straight bar dips."},
cal_tuck_front_lever:{m:["اللاتس، البطن", "Lats, abs"],a:["اتعلّق في البار ودراعك مفرود.", "اسحب البار لتحت بدراع مفرود وارفع جسمك لحد ما يبقى أفقي والركب في صدرك.", "ثبّت وضهرك موازي للأرض."],e:["Hang with straight arms.", "Press the bar down with straight arms and lift your body horizontal, knees to chest.", "Hold with your back parallel to the floor."],ta:"كل ما تفرد رجلك بيصعب.",te:"Extending the legs makes it harder."},
cal_tuck_back_lever:{m:["الكتف، الضهر، الباي", "Shoulders, back, biceps"],a:["من لفّة القطة نزّل جسمك ورا لحد ما يبقى أفقي ووشك للأرض.", "الركب منكمشة والدراع مفرود.", "ثبّت."],e:["From skin the cat, lower your body behind you until it’s horizontal, face down.", "Knees tucked, arms straight.", "Hold."],ta:"الكتف لازم يكون مرن ومسخّن كويس.",te:"Your shoulders need to be mobile and well warmed up."},
cal_assisted_squat:{m:["الأمامية، الألوية", "Quads, glutes"],a:["امسك إطار باب أو كرسي قدامك.", "انزل سكوات لتحت على قد ما تقدر وضهرك مفرود.", "اطلع ساعد نفسك بإيدك على قد الحاجة."],e:["Hold a door frame or chair in front of you.", "Squat as deep as you can with a straight back.", "Stand up, using your hands only as needed."],ta:"بيعلّمك السكوات العميق.",te:"Teaches the deep squat."},
cal_split_squat:{m:["الأمامية، الألوية", "Quads, glutes"],a:["اقف رجل قدام ورجل ورا بخطوة كبيرة.", "انزل لحد ما ركبة الرجل اللي ورا تقرب من الأرض.", "اطلع وكرر وبعدين بدّل."],e:["Stand in a long split stance.", "Lower until your back knee nearly touches the floor.", "Rise, repeat, then switch legs."],ta:"الجسم مفرود والوزن على الرجل اللي قدام.",te:"Stay upright with the weight on the front leg."},
cal_reverse_lunge:{m:["الأمامية، الألوية", "Quads, glutes"],a:["اقف ورجلك على عرض الحوض.", "ارجع خطوة لورا وانزل لحد ما الركبتين 90 درجة.", "ارجع للوقفة وبدّل."],e:["Stand hip-width apart.", "Step back and lower until both knees are at 90 degrees.", "Return to standing and alternate."],ta:"أريح على الركبة من اللانج لقدام.",te:"Easier on the knees than forward lunges."},
cal_sl_glute_bridge:{m:["الألوية، الخلفية", "Glutes, hamstrings"],a:["نام على ضهرك ورجل مثنية والتانية مفرودة لفوق.", "ارفع وسطك لفوق بالرجل اللي على الأرض.", "اعصر المؤخرة فوق وانزل ببطء."],e:["Lie on your back, one knee bent, the other leg straight up.", "Drive your hips up through the planted foot.", "Squeeze the glutes at the top and lower slowly."],ta:"الحوض يفضل مستوي ما يميلش.",te:"Keep your hips level."},
cal_sl_calf_raise:{m:["السمانة", "Calves"],a:["اقف برجل واحدة على طرف سلمة والكعب برا.", "نزّل الكعب لتحت على الآخر.", "اطلع على صوابعك لفوق على الآخر."],e:["Stand on one foot on the edge of a step, heel hanging off.", "Lower the heel all the way down.", "Rise as high as you can on your toes."],ta:"امسك الحيطة للتوازن بس.",te:"Hold a wall only for balance."},
cal_jump_squat:{m:["الأمامية، الألوية (قوة انفجارية)", "Quads, glutes (power)"],a:["انزل سكوات لحد الفخد موازي للأرض.", "نط لفوق بأقصى قوة.", "انزل بنعومة على صوابعك وانزل سكوات على طول."],e:["Squat down until your thighs are parallel.", "Jump up as high as you can.", "Land softly on the balls of your feet straight into the next squat."],ta:"النزول الهادي أهم من النطة العالية.",te:"A soft landing matters more than height."},
cal_bulgarian_bw:{m:["الأمامية، الألوية", "Quads, glutes"],a:["حط ضهر رجلك على كرسي وراك والرجل التانية قدام.", "انزل لحد ما فخد الرجل اللي قدام يبقى موازي للأرض.", "اطلع بالرجل اللي قدام."],e:["Rest the top of your back foot on a chair behind you.", "Lower until your front thigh is parallel to the floor.", "Drive up through the front leg."],ta:"لما يبقى سهل امسك شنطة تقيلة.",te:"When it gets easy, hold a heavy backpack."},
cal_cossack_squat:{m:["الأمامية، الضامة، الألوية", "Quads, adductors, glutes"],a:["اقف ورجلك مفتوحة واسع جدًا.", "انزل على رجل واحدة والتانية تتفرد على الجنب وصوابعها لفوق.", "ارجع للنص وانزل على الجنب التاني."],e:["Stand with a very wide stance.", "Sit down onto one leg while the other straightens, toes up.", "Return to center and go to the other side."],ta:"بيقوّي ويمدّد في نفس الوقت.",te:"Builds strength and mobility together."},
cal_skater_squat:{m:["الأمامية، الألوية، التوازن", "Quads, glutes, balance"],a:["اقف على رجل واحدة والتانية مثنية لورا.", "انزل لحد ما ركبة الرجل اللي ورا تقرب من الأرض والدراع لقدام.", "اطلع من غير ما تلمس الأرض."],e:["Stand on one leg with the other bent behind you.", "Lower until the back knee nearly touches the floor, arms forward.", "Stand back up without touching down."],ta:"حط مخدة تحت الركبة في الأول.",te:"Use a pillow under the knee at first."},
cal_box_pistol:{m:["الأمامية، الألوية", "Quads, glutes"],a:["اقف على رجل واحدة قدام كرسي والرجل التانية مفرودة قدامك.", "انزل ببطء لحد ما تقعد على الكرسي.", "اطلع برجل واحدة من غير مرجحة."],e:["Stand on one leg in front of a chair, the other leg straight out in front.", "Lower slowly until you sit on the chair.", "Stand up on one leg without rocking."],ta:"نزّل ارتفاع الكرسي بالتدريج لحد البيستول الكامل.",te:"Lower the box height over time until you reach a full pistol."},
cal_pistol:{m:["الأمامية، الألوية، التوازن", "Quads, glutes, balance"],a:["اقف على رجل واحدة والتانية مفرودة قدامك.", "انزل لتحت خالص على الرجل الواقفة والدراع لقدام.", "اطلع لفوق من غير ما الرجل التانية تلمس الأرض."],e:["Stand on one leg with the other straight out in front.", "Squat all the way down on the standing leg, arms forward.", "Stand back up without the free leg touching the floor."],ta:"لو بتقع لورا، حط حاجة صغيرة تحت الكعب.",te:"Falling back? Put a small lift under your heel."},
cal_shrimp_squat:{m:["الأمامية، الألوية", "Quads, glutes"],a:["اقف على رجل وامسك رجلك التانية من ورا.", "انزل لحد ما ركبة الرجل اللي ماسكها تلمس الأرض.", "اطلع برجل واحدة."],e:["Stand on one leg and hold your other foot behind you.", "Lower until the held knee touches the floor.", "Stand back up on one leg."],ta:"بيشتغل على الأمامية أكتر من البيستول.",te:"More quad-focused than the pistol."},
cal_sissy_squat:{m:["الأمامية", "Quads"],a:["امسك حاجة جنبك للتوازن واطلع على صوابعك.", "ميّل جسمك لورا والركبة رايحة لقدام لحد ما تقرب من الأرض.", "ارجع لفوق والجسم خط مستقيم من الركبة للراس."],e:["Hold something for balance and rise onto your toes.", "Lean back as your knees travel forward toward the floor.", "Return up keeping a straight line from knees to head."],ta:"تقيل على الركبة، ابدأ بنزول قليل.",te:"Demanding on the knees — start with a short range."},
cal_nordic_curl:{m:["الخلفية", "Hamstrings"],a:["انزل على ركبك وثبّت كعبك تحت كنبة أو مع حد.", "ميّل لقدام ببطء جدًا وجسمك مستقيم من الركبة للراس.", "لما تقع اسند بإيدك وازق نفسك لفوق."],e:["Kneel and anchor your heels under a couch or with a partner.", "Lean forward very slowly, keeping a straight line from knees to head.", "Catch yourself with your hands and push back up."],ta:"ركّز على النزول البطيء، ده المهم.",te:"The slow lowering is what counts."},
cal_hollow_tuck:{m:["البطن", "Abs"],a:["نام على ضهرك والركب في صدرك.", "ارفع كتفك سنة من الأرض ودراعك جنبك.", "لزّق أسفل ضهرك في الأرض وثبّت."],e:["Lie on your back with knees to chest.", "Lift your shoulders slightly, arms by your sides.", "Press your lower back into the floor and hold."],ta:"خطوة قبل الهولو الكامل.",te:"The step before the full hollow hold."},
cal_arch_hold:{m:["أسفل الضهر، الألوية", "Lower back, glutes"],a:["نام على بطنك ودراعك مفرود قدامك.", "ارفع دراعك وصدرك ورجلك من الأرض مع بعض.", "ثبّت وبصّ للأرض."],e:["Lie face down with arms straight overhead.", "Lift your arms, chest and legs off the floor together.", "Hold, looking at the floor."],ta:"عكس الهولو، والاتنين أساس الكالستينكس.",te:"The opposite of the hollow — both are calisthenics basics."},
cal_tuck_l_sit:{m:["البطن، التراي، الكتف", "Abs, triceps, shoulders"],a:["اقعد وحط إيدك على الأرض جنب وسطك (أو على بارالتس).", "ازق الأرض لحد ما وسطك يرتفع والركب منكمشة في صدرك.", "ثبّت."],e:["Sit with hands on the floor beside your hips (or on parallettes).", "Push down until your hips lift, knees tucked to chest.", "Hold."],ta:"البارالتس أو كتابين بيسهّلوها.",te:"Parallettes or two books make it easier."},
cal_hanging_l_sit:{m:["البطن، القابضات", "Abs, hip flexors"],a:["اتعلّق في العقلة ودراعك مفرود.", "ارفع رجلك مفرودة لحد ما تبقى موازية للأرض.", "ثبّت من غير مرجحة."],e:["Hang from the bar with straight arms.", "Raise straight legs until they’re parallel to the floor.", "Hold without swinging."],ta:"ابدأ بالركب منكمشة لو مش قادر.",te:"Start with tucked knees if needed."},
cal_dragon_flag_neg:{m:["البطن كلها", "Entire abs"],a:["نام على بنش وامسك طرفه ورا راسك.", "ارفع جسمك كله لفوق على كتفك وجسمك مستقيم.", "نزّل جسمك ببطء جدًا لحد ما يقرب من البنش."],e:["Lie on a bench and grip it behind your head.", "Lift your whole body up onto your shoulders in a straight line.", "Lower very slowly until you nearly touch the bench."],ta:"وسطك ما يتنيش. ابدأ بركب منكمشة.",te:"Don’t bend at the hips. Start with tucked knees."},
incline_curl:{m:['الباي (الرأس الطويلة)','Biceps (long head)'],a:['اقعد على بنش مايل 45–60° ودراعاتك مدلدلة لتحت بالدمبلز.','ارفع الدمبلز لكتفك والكوع ثابت مكانه.','نزّل بالراحة لحد ما دراعك يتفرد على الآخر.'],e:['Sit on a bench set to 45–60° with arms hanging straight down holding dumbbells.','Curl the dumbbells up while keeping your elbows still.','Lower slowly to a full stretch.'],ta:'الوضع ده بيفرد الباي أكتر، فابدأ بوزن أخف من الباي العادي.',te:'This position stretches the biceps more, so go lighter than a standing curl.'},
db_preacher:{m:['الباي','Biceps'],a:['اسند دراعك على مسند البريتشر وامسك الدمبل.','ارفع الدمبل لكتفك.','نزّل بالراحة لحد ما دراعك يتفرد تقريباً.'],e:['Rest one upper arm on the preacher pad holding a dumbbell.','Curl the dumbbell up toward your shoulder.','Lower slowly to near full extension.'],ta:'دراع واحد كل مرة بيخليك تركّز على كل جنب.',te:'One arm at a time lets you focus on each side.'},
single_pushdown:{m:['التراي','Triceps'],a:['امسك طرف الحبل بإيد واحدة والكوع لازق في جنبك.','افرد دراعك لتحت لحد الآخر.','ارجع لحد مستوى صدرك بالراحة.'],e:['Hold one end of the rope with one hand, elbow pinned to your side.','Extend your arm fully down.','Return to chest height slowly.'],ta:'لف كفك لبرا سنة في آخر الحركة.',te:'Turn your palm slightly outward at the bottom.'},
cable_rev_fly:{m:['الكتف الخلفي، منتصف الضهر','Rear delts, mid back'],a:['اقف بين البكرتين وهما على مستوى كتفك، وامسك الكابلات متقاطعة قدامك.','افتح دراعاتك لجنب ولورا والكوع مثني سنة.','ارجع بتحكم.'],e:['Stand between pulleys set at shoulder height, cables crossed in front of you.','Open your arms out and back with a slight elbow bend.','Return under control.'],ta:'الوزن خفيف، والحركة من الكتف مش من الضهر.',te:'Keep it light; move from the shoulders, not the back.'},
seated_leg_press:{m:['الأمامية، الألوية','Quads, glutes'],a:['اقعد وضهرك على المسند ورجلك على المنصة بعرض الكتف.','ادفع المنصة لحد ما رجلك تتفرد من غير ما تقفل الركبة.','ارجع بالراحة لحد ما الركبة تبقى 90° تقريباً.'],e:['Sit with your back on the pad, feet shoulder-width on the plate.','Press until your legs are extended without locking your knees.','Return slowly to about 90° at the knee.'],ta:'وسطك يفضل لازق في الكرسي طول الحركة.',te:'Keep your hips on the seat throughout.'},
bench:{m:['الصدر، الكتف الأمامي، التراي','Chest, front delts, triceps'],a:['نام على البنش ورجلك ثابتة في الأرض ولوحي كتفك مضمومين لورا.','امسك البار أعرض من كتفك بشوية ونزّله بالراحة لحد منتصف صدرك.','ادفع البار لفوق في خط مستقيم لحد ما دراعك يتفرد.'],e:['Lie on the bench, feet planted, shoulder blades pulled back.','Grip slightly wider than shoulders and lower the bar to mid-chest under control.','Press straight up until your arms are extended.'],ta:'خلّي كوعك زاوية حوالي 45° من جسمك ومتنطّش البار من على صدرك.',te:'Keep elbows around 45° from your body and don’t bounce the bar off your chest.'},
incline_bb:{m:['أعلى الصدر، الكتف الأمامي، التراي','Upper chest, front delts, triceps'],a:['اظبط البنش على زاوية 30–45°.','نزّل البار لأعلى صدرك تحت الترقوة.','ادفع لفوق وثبّت ضهرك على البنش.'],e:['Set the bench to 30–45°.','Lower the bar to your upper chest, just below the collarbone.','Press up while keeping your back on the bench.'],ta:'الزاوية العالية أوي بتحوّل الشغل على الكتف.',te:'Too steep an angle shifts the work to your shoulders.'},
decline_bb:{m:['أسفل الصدر، التراي','Lower chest, triceps'],a:['ثبّت رجلك في مسند البنش النازل.','نزّل البار لأسفل صدرك.','ادفع لفوق لحد ما دراعك يتفرد.'],e:['Hook your legs into the decline bench.','Lower the bar to your lower chest.','Press up to full extension.'],ta:'استخدم سبوتر لأن رجوع البار للحامل أصعب في الوضع ده.',te:'Use a spotter; re-racking is harder in this position.'},
db_bench:{m:['الصدر، الكتف الأمامي، التراي','Chest, front delts, triceps'],a:['نام على البنش والدمبلز عند صدرك.','ادفع الدمبلز لفوق لحد ما يقربوا من بعض.','نزّلهم بالراحة لحد ما تحس بإطالة في الصدر.'],e:['Lie on the bench with dumbbells at chest level.','Press up until they nearly touch.','Lower slowly until you feel a stretch in your chest.'],ta:'الدمبلز بتديك مدى حركة أكبر من البار، استغله من غير ما تنزل لدرجة الألم في الكتف.',te:'Dumbbells allow a deeper range; use it without pain in the shoulder.'},
incline_db:{m:['أعلى الصدر، الكتف الأمامي','Upper chest, front delts'],a:['البنش على 30–45° والدمبلز عند أعلى صدرك.','ادفع لفوق وقرّبهم من بعض في الآخر.','نزّل بتحكم لنفس النقطة.'],e:['Bench at 30–45°, dumbbells at upper chest.','Press up, bringing them together at the top.','Lower under control to the start.'],ta:'ما تقفلش الكوع بعنف في آخر الحركة.',te:'Don’t snap your elbows locked at the top.'},
db_fly:{m:['الصدر','Chest'],a:['نام على البنش والدمبلز فوق صدرك والكوع مثني سنة صغيرة.','افتح دراعاتك لجنب في قوس واسع لحد ما تحس بإطالة.','ارجع بنفس القوس كأنك بتحضن شجرة.'],e:['Lie down with dumbbells above your chest, elbows slightly bent.','Open your arms in a wide arc until you feel a stretch.','Return along the same arc, like hugging a tree.'],ta:'ثبّت ثنية الكوع طول الحركة، دي مش ضغط.',te:'Keep the elbow bend fixed; it’s not a press.'},
iso_incline_press:{m:['أعلى الصدر، الكتف الأمامي، التراي','Upper chest, front delts, triceps'],a:['اظبط الكرسي بحيث المقابض تبقى على مستوى أعلى صدرك، وضهرك لازق في المسند.','ادفع المقبضين لقدام ولفوق لحد ما دراعك يتفرد تقريباً، وكل دراع بيشتغل لوحده.','ارجع بالراحة لحد ما تحس بإطالة في أعلى الصدر.'],e:['Set the seat so the handles line up with your upper chest, back flat on the pad.','Press both handles up and forward to near full extension; each arm moves independently.','Return slowly to a stretch in the upper chest.'],ta:'لو المقابض أعلى من كتفك، الشغل هيروح على الكتف بدل الصدر.',te:'If the handles sit above your shoulders, the work shifts from chest to shoulders.'},
lying_cable_fly:{m:['الصدر، الكتف الأمامي','Chest, front delts'],a:['حط بنش مفرود في النص بين بكرتين الكابل من تحت، ونام عليه وامسك مقبض في كل إيد.','ابدأ ودراعاتك مفتوحة لجنب على مستوى صدرك، والكوع مثني سنة صغيرة.','قفّل إيديك فوق صدرك في قوس، واعصر الصدر ثانية، وبعدين ارجع بالراحة.'],e:['Set a flat bench centered between two low pulleys, lie down and hold one handle in each hand.','Start with your arms open to the sides at chest level, elbows slightly bent.','Bring your hands together over your chest in an arc, squeeze for a second, then return slowly.'],ta:'الكابل بيفضل شادد العضلة طول الحركة، حتى فوق، عكس الدمبلز.',te:'Unlike dumbbells, the cables keep tension on the chest even at the top.'},
iliac_pd:{m:['أسفل اللاتس، الباي','Lower lats, biceps'],a:['اقعد على بنش عالي بالعكس وصدرك ساند على ضهر البنش، ووشك ناحية الكابل.','سند بإيد على أعلى ضهر البنش، وبالإيد التانية امسك المقبض والدراع مفرود لفوق ناحية البكرة لحد ما تحس بإطالة في جنب ضهرك.','اسحب الكوع لتحت ولجنبك ناحية الحوض، وارجع بالراحة للإطالة الكاملة.'],e:['Sit backwards on an incline bench with your chest on the backrest, facing the cable.','Brace one hand on top of the backrest; with the other hold the handle, arm reaching up toward the high pulley until your side stretches.','Drive the elbow down to your side toward the hip, then return slowly to a full stretch.'],ta:'فكّر إنك بتوصّل كوعك لجيبك، مش بتشد المقبض لكتفك.',te:'Think about driving your elbow into your pocket, not pulling the handle to your shoulder.'},
chest_press:{m:['الصدر، التراي','Chest, triceps'],a:['اظبط الكرسي بحيث المقابض على مستوى منتصف صدرك.','ادفع لقدام لحد ما دراعك يتفرد تقريباً.','ارجع بالراحة من غير ما الأوزان تخبط.'],e:['Set the seat so handles line up with mid-chest.','Press forward to near full extension.','Return slowly without letting the stack touch.'],ta:'ضهرك لازق في المسند طول الوقت.',te:'Keep your back against the pad throughout.'},
fly:{m:['الصدر','Chest'],a:['اقعد وضهرك على المسند والمقابض على مستوى صدرك.','قرّب دراعاتك لقدام لحد ما المقابض تتقابل.','ارجع بالراحة لحد ما تحس بإطالة.'],e:['Sit with your back on the pad, handles at chest height.','Bring your arms together in front.','Return slowly to a comfortable stretch.'],ta:'اعصر صدرك ثانية في النص.',te:'Squeeze your chest for a second at the middle.'},
cable_fly:{m:['الصدر','Chest'],a:['اظبط البكرات فوق وامسك المقبضين وخطوة لقدام.','اسحب إيديك لتحت ولقدام لحد ما يتقابلوا قدام وسطك.','ارجع بتحكم لحد ما تحس بإطالة.'],e:['Set pulleys high, grab both handles and step forward.','Pull your hands down and together in front of your waist.','Return under control to a stretch.'],ta:'ميّل جسمك لقدام سنة صغيرة وثبّته.',te:'Lean slightly forward and keep your torso still.'},
low_cable_fly:{m:['أعلى الصدر','Upper chest'],a:['اظبط البكرات تحت وامسك المقبضين.','اسحب إيديك لفوق ولقدام لحد مستوى كتفك.','نزّل بالراحة لنفس المكان.'],e:['Set pulleys low and grab the handles.','Sweep your hands up and together to shoulder height.','Lower slowly to the start.'],ta:'الكوع مثني سنة ثابتة.',te:'Keep a slight, fixed bend in the elbows.'},
dips:{m:['أسفل الصدر، التراي، الكتف الأمامي','Lower chest, triceps, front delts'],a:['امسك المتوازي وارفع جسمك ودراعك مفرود.','ميّل لقدام سنة ونزّل لحد ما الكوع يبقى 90°.','ادفع لفوق لحد ما دراعك يتفرد.'],e:['Support yourself on the bars with arms straight.','Lean slightly forward and lower until elbows hit 90°.','Push back up to straight arms.'],ta:'لو كتفك بيوجعك قلّل النزول.',te:'If your shoulders hurt, shorten the range.'},
pushup:{m:['الصدر، التراي، الكتف، الكور','Chest, triceps, shoulders, core'],a:['إيديك أعرض من كتفك بسنة وجسمك خط مستقيم.','انزل لحد ما صدرك يقرب من الأرض.','ادفع لفوق وإنت مشدود البطن.'],e:['Hands slightly wider than shoulders, body in a straight line.','Lower until your chest nearly touches the floor.','Push back up with your core braced.'],ta:'ما تخليش وسطك ينزل لتحت.',te:'Don’t let your hips sag.'},
incline_pushup:{m:['الصدر، التراي','Chest, triceps'],a:['حط إيديك على بنش أو سطح عالي.','انزل بصدرك ناحية الحافة وجسمك مستقيم.','ادفع لفوق.'],e:['Place your hands on a bench or raised surface.','Lower your chest toward the edge, body straight.','Push back up.'],ta:'أسهل نسخة من الضغط، كل ما السطح يوطى بتصعب.',te:'The easiest push-up variation; lower surface means harder.'},
deadlift:{m:['الخلفية، الألوية، أسفل الضهر، الترابيس','Hamstrings, glutes, lower back, traps'],a:['قف ونص رجلك تحت البار، وامسك البار جنب رجلك.','ضهرك مفرود وصدرك لفوق، ادفع الأرض برجلك وارفع البار قريب من جسمك.','اقف مفرود في الآخر ونزّل بنفس الطريق.'],e:['Stand with mid-foot under the bar, grip just outside your legs.','With a flat back and chest up, push the floor away and lift the bar close to your body.','Stand tall, then lower along the same path.'],ta:'البار لازم يفضل لازق في رجلك، وما تقوّسش ضهرك.',te:'Keep the bar against your legs and never round your back.'},
bb_row:{m:['منتصف الضهر، اللاتس، الباي','Mid back, lats, biceps'],a:['انحني لقدام 45° وضهرك مفرود والبار في إيدك.','اسحب البار لأسفل صدرك أو بطنك.','نزّل بتحكم.'],e:['Hinge forward about 45° with a flat back, holding the bar.','Pull the bar to your lower chest or belly.','Lower under control.'],ta:'ما تستخدمش جسمك عشان ترمي الوزن لفوق.',te:'Don’t swing your torso to heave the weight.'},
tbar_row:{m:['منتصف الضهر، اللاتس، الكتف الخلفي','Mid back, lats, rear delts'],a:['اطلع على منصة الجهاز وسند صدرك على المسند المايل، وامسك المقابض والدراع مفرود.','اسحب المقابض ناحية صدرك والكوع لورا، واعصر لوحي الكتف مع بعض.','نزّل بالراحة لحد ما دراعك يتفرد.'],e:['Step onto the platform, rest your chest on the angled pad and grab the handles with straight arms.','Row the handles toward your chest, elbows back, squeezing your shoulder blades.','Lower slowly to full extension.'],ta:'صدرك يفضل لازق في المسند طول الوقت، فمش هتقدر تغش بضهرك.',te:'Keep your chest on the pad the whole time so your lower back can’t help.'},
db_row:{m:['اللاتس، منتصف الضهر','Lats, mid back'],a:['ركبة وإيد على البنش والدمبل في الإيد التانية.','اسحب الدمبل ناحية وسطك والكوع قريب من جسمك.','نزّل لحد ما الدراع يتفرد.'],e:['One knee and hand on the bench, dumbbell in the other hand.','Pull the dumbbell toward your hip, elbow close to your body.','Lower to a full stretch.'],ta:'تخيّل إنك بتسحب بكوعك مش بإيدك.',te:'Think of pulling with your elbow, not your hand.'},
db_shrug:{m:['الترابيس','Traps'],a:['اقف والدمبلز جنبك.','ارفع كتافك لفوق ناحية ودانك.','اثبت ثانية ونزّل بالراحة.'],e:['Stand with dumbbells at your sides.','Raise your shoulders toward your ears.','Pause, then lower slowly.'],ta:'ما تلفّش كتافك، طلوع ونزول بس.',te:'Don’t roll your shoulders; just up and down.'},
lat_pd:{m:['اللاتس، الباي','Lats, biceps'],a:['امسك البار أعرض من كتفك واقعد ورجلك مثبتة.','اسحب البار لأعلى صدرك وصدرك لفوق.','طلّع البار بالراحة لحد ما دراعك يتفرد.'],e:['Grip wider than shoulders and sit with legs locked in.','Pull the bar to your upper chest, chest up.','Let it rise slowly to full stretch.'],ta:'ما تسحبش ورا راسك.',te:'Don’t pull behind your neck.'},
close_pd:{m:['اللاتس، الباي','Lats, biceps'],a:['استخدم مقبض ضيق واقعد.','اسحب المقبض لصدرك والكوع لتحت.','ارجع بتحكم.'],e:['Use a close-grip handle and sit down.','Pull to your chest, elbows driving down.','Return under control.'],ta:'ميّل لورا سنة صغيرة بس.',te:'Lean back only slightly.'},
cable_row:{m:['منتصف الضهر، اللاتس','Mid back, lats'],a:['اقعد وركبك مثنية سنة وضهرك مفرود.','اسحب المقبض لبطنك واعصر ضهرك.','افرد دراعك قدام بالراحة.'],e:['Sit with knees slightly bent and back straight.','Pull the handle to your belly and squeeze your back.','Extend your arms slowly.'],ta:'ما ترجعش بجسمك لورا عشان تكمّل العدّة.',te:'Don’t rock back to finish the rep.'},
straight_pd:{m:['اللاتس','Lats'],a:['اقف قدام الكابل وامسك البار ودراعك مفرود.','انزل بالبار لحد فخذك ودراعك مفرود.','ارجع لفوق بتحكم.'],e:['Face the cable, arms straight on the bar.','Sweep the bar down to your thighs, arms straight.','Return up under control.'],ta:'الكوع ثابت، الحركة من الكتف.',te:'Elbows stay fixed; the motion is from the shoulder.'},
machine_row:{m:['منتصف الضهر، اللاتس','Mid back, lats'],a:['صدرك على المسند وامسك المقابض.','اسحب لورا واعصر لوحي الكتف.','ارجع بالراحة.'],e:['Chest on the pad, grab the handles.','Pull back and squeeze your shoulder blades.','Return slowly.'],ta:'ثانية عصرة في الآخر.',te:'Hold the squeeze for a second.'},
back_ext:{m:['أسفل الضهر، الألوية، الخلفية','Lower back, glutes, hamstrings'],a:['ثبّت رجلك والمسند تحت وسطك.','انزل لقدام وضهرك مفرود.','اطلع لحد ما جسمك يبقى خط مستقيم.'],e:['Lock your legs in, pad under your hips.','Lower forward with a straight back.','Rise until your body is in a straight line.'],ta:'ما تطلعش أعلى من الخط المستقيم.',te:'Don’t hyperextend past straight.'},
pullup:{m:['اللاتس، الباي، منتصف الضهر','Lats, biceps, mid back'],a:['اتعلّق في العقلة وكفك لقدام أعرض من كتفك.','اسحب نفسك لحد ما دقنك تعدّي البار.','انزل بالراحة لحد ما دراعك يتفرد.'],e:['Hang with palms forward, wider than shoulders.','Pull until your chin clears the bar.','Lower slowly to full hang.'],ta:'لو صعبة، ابدأ بأستك مساعدة أو النزول البطيء بس.',te:'If too hard, use an assist band or slow negatives.'},
chinup:{m:['الباي، اللاتس','Biceps, lats'],a:['اتعلّق وكفك ناحيتك بعرض كتفك.','اسحب لحد ما دقنك تعدّي البار.','انزل بتحكم.'],e:['Hang with palms facing you, shoulder-width.','Pull until your chin clears the bar.','Lower under control.'],ta:'أسهل من العقلة العادية وبتشغّل الباي أكتر.',te:'Easier than pull-ups and hits the biceps more.'},
inv_row:{m:['منتصف الضهر، الباي','Mid back, biceps'],a:['نام تحت بار في السميث على ارتفاع الوسط وامسكه.','اسحب صدرك للبار وجسمك مستقيم.','انزل بالراحة.'],e:['Lie under a bar set at waist height and grab it.','Pull your chest to the bar, body straight.','Lower slowly.'],ta:'كل ما رجلك تبعد بتصعب.',te:'Moving your feet further out makes it harder.'},
ohp:{m:['الكتف، التراي، أعلى الصدر','Shoulders, triceps, upper chest'],a:['اقف والبار على أعلى صدرك ومسكة بعرض الكتف.','ادفع البار لفوق راسك وراسك ترجع لورا سنة عشان يعدّي.','نزّل لأعلى صدرك بتحكم.'],e:['Stand with the bar on your upper chest, shoulder-width grip.','Press overhead, moving your head back slightly to clear the bar.','Lower to your upper chest under control.'],ta:'شد بطنك وألويتك عشان ما تقوّسش ضهرك.',te:'Brace your abs and glutes so you don’t arch.'},
upright_row:{m:['الكتف الجانبي، الترابيس','Side delts, traps'],a:['اقف والبار قدامك بمسكة بعرض الكتف.','اسحب البار لفوق لحد تحت صدرك والكوع لفوق.','نزّل بالراحة.'],e:['Stand holding the bar with a shoulder-width grip.','Pull up to lower chest, elbows leading.','Lower slowly.'],ta:'ما تطلعش أعلى من كتفك لو بتحس بقرص في الكتف.',te:'Stop below shoulder height if you feel pinching.'},
db_sp:{m:['الكتف، التراي','Shoulders, triceps'],a:['اقعد على بنش مفرود والدمبلز عند كتفك.','ادفع لفوق لحد ما دراعك يتفرد.','نزّل لمستوى الودن.'],e:['Sit upright with dumbbells at shoulder level.','Press up to full extension.','Lower to ear level.'],ta:'ضهرك لازق في المسند.',te:'Keep your back against the pad.'},
arnold:{m:['الكتف كله','All three delts'],a:['ابدأ والدمبلز قدام وشك وكفك ناحيتك.','وإنت بتدفع لفوق لف كفك لقدام.','ارجع بنفس اللفة.'],e:['Start with dumbbells in front of your face, palms toward you.','Rotate your palms forward as you press up.','Reverse the rotation on the way down.'],ta:'ابدأ بوزن أخف من ضغط الأكتاف العادي.',te:'Use less weight than a regular press.'},
lat_raise:{m:['الكتف الجانبي','Side delts'],a:['اقف والدمبلز جنبك والكوع مثني سنة.','ارفع دراعاتك لجنب لحد مستوى الكتف.','نزّل ببطء.'],e:['Stand with dumbbells at your sides, elbows slightly bent.','Raise your arms out to shoulder height.','Lower slowly.'],ta:'الوزن الخفيف بتحكم أحسن من التقيل بالمرجحة.',te:'Light and controlled beats heavy and swinging.'},
front_raise:{m:['الكتف الأمامي','Front delts'],a:['اقف والدمبلز قدام فخذك.','ارفع دراع لقدام لحد مستوى الكتف.','نزّل بالراحة.'],e:['Stand with dumbbells in front of your thighs.','Raise your arms forward to shoulder height.','Lower slowly.'],ta:'ما تمرجحش جسمك.',te:'Don’t swing your body.'},
rear_delt:{m:['الكتف الخلفي، منتصف الضهر','Rear delts, mid back'],a:['انحني لقدام وضهرك مفرود والدمبلز تحتك.','افتح دراعاتك لجنب لحد مستوى الكتف.','نزّل بتحكم.'],e:['Hinge forward with a flat back, dumbbells below you.','Raise your arms out to the sides to shoulder level.','Lower under control.'],ta:'ركّز تحس بخلف الكتف مش الترابيس.',te:'Feel it in the back of the shoulder, not the traps.'},
cable_lat:{m:['الكتف الجانبي','Side delts'],a:['اقف جنب الكابل وامسك المقبض بالإيد البعيدة.','ارفع دراعك لجنب لحد مستوى الكتف.','نزّل بالراحة.'],e:['Stand side-on to a low cable, handle in the far hand.','Raise your arm out to shoulder height.','Lower slowly.'],ta:'الكابل بيحافظ على الشد طول الحركة.',te:'The cable keeps tension through the whole range.'},
face_pull:{m:['الكتف الخلفي، الروتيتور كاف','Rear delts, rotator cuff'],a:['الكابل على مستوى وشك والحبل في إيدك.','اسحب الحبل ناحية وشك وافتح إيديك لجنب.','ارجع بتحكم.'],e:['Cable at face height, rope in hand.','Pull toward your face, spreading your hands apart.','Return under control.'],ta:'تمرين ممتاز لصحة الكتف، الوزن خفيف.',te:'Great for shoulder health; keep it light.'},
shoulder_m:{m:['الكتف، التراي','Shoulders, triceps'],a:['اظبط الكرسي والمقابض عند كتفك.','ادفع لفوق.','نزّل بالراحة.'],e:['Set the seat so handles are at shoulder level.','Press up.','Lower slowly.'],ta:'آمن لو بتتمرن لوحدك من غير سبوتر.',te:'A safe choice when training without a spotter.'},
pike_pushup:{m:['الكتف، التراي','Shoulders, triceps'],a:['اعمل شكل V مقلوب ووسطك لفوق.','نزّل راسك ناحية الأرض بين إيديك.','ادفع لفوق.'],e:['Form an inverted V with hips high.','Lower your head toward the floor between your hands.','Push back up.'],ta:'كل ما رجلك تبقى أعلى بتصعب.',te:'Raising your feet makes it harder.'},
squat:{m:['الأمامية، الألوية، الضهر السفلي','Quads, glutes, lower back'],a:['البار على أعلى ضهرك ورجلك بعرض الكتف.','انزل لورا وتحت كأنك قاعد على كرسي لحد ما فخذك يوازي الأرض.','اطلع وادفع الأرض برجلك كلها.'],e:['Bar on your upper back, feet shoulder-width.','Sit back and down until thighs are parallel.','Drive up through your whole foot.'],ta:'الركبة ماشية في اتجاه صوابع رجلك وضهرك مفرود.',te:'Knees track over toes and your back stays neutral.'},
front_squat:{m:['الأمامية، الكور','Quads, core'],a:['البار على كتفك الأمامي والكوع لفوق.','انزل وجسمك مفرود لحد تحت.','اطلع لفوق.'],e:['Bar on your front delts, elbows high.','Squat down with an upright torso.','Stand back up.'],ta:'لو الكوع وقع البار هيقع لقدام.',te:'If your elbows drop, the bar rolls forward.'},
rdl:{m:['الخلفية، الألوية، أسفل الضهر','Hamstrings, glutes, lower back'],a:['اقف والبار قدام فخذك والركبة مثنية سنة.','ادفع وسطك لورا ونزّل البار على رجلك لحد ما تحس بشد في الخلفية.','ارجع لفوق بدفع الوسط لقدام.'],e:['Stand holding the bar at your thighs, knees soft.','Push your hips back and slide the bar down until your hamstrings stretch.','Drive your hips forward to stand.'],ta:'ضهرك مفرود والحركة من الوسط مش من الضهر.',te:'Back flat; the motion comes from the hips.'},
sumo_dl:{m:['الألوية، الداخلية، الأمامية','Glutes, adductors, quads'],a:['رجلك واسعة وصوابعك لبرا، وامسك البار بين رجلك.','صدرك لفوق وادفع الأرض لبرا وارفع.','اقف مفرود ونزّل بتحكم.'],e:['Wide stance, toes out, grip inside your legs.','Chest up, push the floor apart and lift.','Stand tall, then lower under control.'],ta:'ركبك لبرا في اتجاه صوابعك.',te:'Push your knees out over your toes.'},
hip_thrust:{m:['الألوية، الخلفية','Glutes, hamstrings'],a:['ضهرك على البنش والبار على وسطك.','ادفع وسطك لفوق لحد ما جسمك يبقى مستقيم من الكتف للركبة.','نزّل بالراحة.'],e:['Upper back on the bench, bar over your hips.','Drive your hips up until shoulders to knees are straight.','Lower slowly.'],ta:'اعصر الألوية ثانية فوق.',te:'Squeeze your glutes for a second at the top.'},
lunge:{m:['الأمامية، الألوية','Quads, glutes'],a:['اقف والدمبلز جنبك.','خد خطوة كبيرة لقدام وانزل لحد ما الركبتين يبقوا 90°.','ادفع واتقدّم بالرجل التانية.'],e:['Stand with dumbbells at your sides.','Step forward and lower until both knees are at 90°.','Push off and step through with the other leg.'],ta:'جسمك مفرود والركبة ما تخبطش الأرض.',te:'Stay upright and don’t slam the back knee down.'},
bulgarian:{m:['الأمامية، الألوية','Quads, glutes'],a:['رجل ورا على بنش والتانية لقدام.','انزل لحد ما فخذ الرجل القدام يوازي الأرض.','اطلع بدفع الرجل القدام.'],e:['Rear foot on a bench, front foot forward.','Lower until the front thigh is parallel.','Drive up through the front leg.'],ta:'ابدأ من غير وزن لحد ما توازنك يتظبط.',te:'Start bodyweight until your balance is solid.'},
goblet:{m:['الأمامية، الألوية، الكور','Quads, glutes, core'],a:['امسك الدمبل قدام صدرك بإيديك الاتنين.','انزل سكوات والكوع بين ركبك.','اطلع لفوق.'],e:['Hold a dumbbell at your chest with both hands.','Squat down, elbows inside your knees.','Stand up.'],ta:'أحسن تمرين تتعلّم بيه شكل السكوات.',te:'A great way to learn squat form.'},
step_up:{m:['الأمامية، الألوية','Quads, glutes'],a:['اقف قدام بوكس أو بنش.','حط رجل فوق واطلع بيها لحد ما تقف.','انزل بنفس الرجل بالراحة.'],e:['Stand facing a box or bench.','Place one foot up and stand on it.','Step down slowly with the same leg.'],ta:'ادفع بالرجل اللي فوق مش اللي تحت.',te:'Push through the top leg, not the bottom one.'},
kb_swing:{m:['الألوية، الخلفية، الكور','Glutes, hamstrings, core'],a:['رجلك أعرض من كتفك والكيتل بيل بين رجلك.','ادفع وسطك لقدام بقوة والكيتل بيل يطلع لمستوى صدرك.','سيبه ينزل بين رجلك وانحني من الوسط.'],e:['Feet wider than shoulders, kettlebell between your legs.','Snap your hips forward so the bell floats to chest height.','Let it swing back between your legs as you hinge.'],ta:'القوة من الوسط مش من دراعك.',te:'Power comes from the hips, not the arms.'},
leg_press:{m:['الأمامية، الألوية','Quads, glutes'],a:['رجلك على المنصة بعرض الكتف.','نزّل المنصة لحد ما ركبك تبقى 90°.','ادفع لفوق من غير ما تقفل الركبة.'],e:['Feet shoulder-width on the platform.','Lower until your knees reach about 90°.','Press up without locking your knees.'],ta:'وسطك ما يرفعش من على الكرسي تحت.',te:'Don’t let your hips lift off the seat at the bottom.'},
hack_squat:{m:['الأمامية','Quads'],a:['ضهرك على المسند وكتافك تحت المساند.','انزل لحد ما فخذك يوازي المنصة.','ادفع لفوق.'],e:['Back on the pad, shoulders under the supports.','Lower until thighs are parallel to the platform.','Push back up.'],ta:'رجلك أوطى على المنصة بتركّز على الأمامية.',te:'Lower foot placement targets the quads more.'},
leg_ext:{m:['الأمامية','Quads'],a:['اقعد والمسند فوق كعب رجلك.','افرد رجلك لقدام.','نزّل بالراحة.'],e:['Sit with the pad on your lower shins.','Extend your legs.','Lower slowly.'],ta:'اثبت ثانية فوق.',te:'Hold for a second at the top.'},
leg_curl:{m:['الخلفية','Hamstrings'],a:['نام أو اقعد والمسند فوق كعبك.','اثني رجلك ناحية الألوية.','ارجع بتحكم.'],e:['Lie or sit with the pad above your heels.','Curl your heels toward your glutes.','Return under control.'],ta:'وسطك ما يرفعش من على الجهاز.',te:'Keep your hips down on the machine.'},
abductor:{m:['الألوية الجانبية','Outer glutes'],a:['اقعد والمساند على جنب ركبك من برا.','افتح رجلك لبرا.','ارجع بالراحة.'],e:['Sit with pads on the outside of your knees.','Push your legs apart.','Return slowly.'],ta:'ميّل لقدام سنة عشان تحس بالألوية أكتر.',te:'Lean forward slightly to feel the glutes more.'},
adductor:{m:['الداخلية','Inner thighs'],a:['اقعد والمساند جوه ركبك.','قفّل رجلك على بعض.','افتح بالراحة.'],e:['Sit with pads on the inside of your knees.','Squeeze your legs together.','Open slowly.'],ta:'ابدأ بمدى حركة مريح.',te:'Start with a comfortable range.'},
calf:{"m": ["السمانة", "Calves"], "a": ["اقف على جهاز الهاك سكوات وضهرك على المسند وكتفك تحت المخدات، ومشط رجلك بس على الحافة اللي تحت من المنصة والكعب برا.", "افرد رجلك وفك قفل الجهاز، ونزّل كعبك لتحت الحافة لإطالة كاملة.", "اطلع على صوابعك لأعلى نقطة واعصر السمانة ثانية، وانزل ببطء."], "e": ["Stand in the hack squat machine, back on the pad and shoulders under the pads, with only the balls of your feet on the bottom edge of the platform, heels hanging off.", "Straighten your legs, release the safety and lower your heels below the edge for a full stretch.", "Rise onto your toes as high as you can, squeeze for a second, then lower slowly."], "ta": "الركبة مفرودة طول الحركة، والحركة كلها من الكاحل.", "te": "Keep the knees straight; all the movement is at the ankle."},
bw_squat:{m:['الأمامية، الألوية','Quads, glutes'],a:['اقف ورجلك بعرض الكتف ودراعك لقدام.','انزل لحد ما فخذك يوازي الأرض.','اطلع لفوق.'],e:['Stand shoulder-width, arms forward.','Squat until thighs are parallel.','Stand up.'],ta:'كعبك على الأرض طول الوقت.',te:'Keep your heels down.'},
glute_bridge:{m:['الألوية، الخلفية','Glutes, hamstrings'],a:['نام على ضهرك وركبك مثنية ورجلك على الأرض.','ارفع وسطك لفوق.','نزّل بالراحة.'],e:['Lie on your back, knees bent, feet flat.','Lift your hips.','Lower slowly.'],ta:'اعصر الألوية فوق.',te:'Squeeze your glutes at the top.'},
wall_sit:{m:['الأمامية','Quads'],a:['سند ضهرك على الحيطة.','انزل لحد ما ركبك تبقى 90°.','اثبت في الوضع ده.'],e:['Lean your back against a wall.','Slide down until your knees are at 90°.','Hold the position.'],ta:'ركبك فوق كعبك بالظبط.',te:'Knees directly above your ankles.'},
bb_curl:{m:['الباي','Biceps'],a:['اقف والبار في إيدك وكفك لقدام.','اثني الكوع وارفع البار لصدرك.','نزّل بالراحة.'],e:['Stand holding the bar, palms forward.','Curl the bar up to your chest.','Lower slowly.'],ta:'الكوع ثابت جنب جسمك.',te:'Keep elbows pinned to your sides.'},
skull:{m:['التراي','Triceps'],a:['نام على البنش والبار فوقك ودراعك مفرود.','اثني الكوع ونزّل البار ناحية جبهتك.','افرد لفوق.'],e:['Lie down with the bar above you, arms straight.','Bend at the elbows to lower the bar toward your forehead.','Extend back up.'],ta:'الكوع يفضل مشاور لفوق.',te:'Keep your elbows pointing up.'},
